<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="description" content="Hanbit — an ad-free Korean trainer built on retrieval practice, FSRS spaced repetition, real conversations and speaking drills. Works offline, stores nothing anywhere but your own browser.">
<title>한빛 Hanbit · Learn Korean</title>
<!-- Still no third-party requests of any kind: Korean text uses the system
     font stack, and the only things ever fetched are this app's own files from
     the same address you opened. Nothing is logged or phoned home. The one
     exception is opt-in and clearly labelled — pronunciation checking hands
     your recording to the browser's own speech recogniser, which on Chrome and
     Safari runs in the cloud. Leave it off and the app never touches a network
     again after the first load. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hanbit">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236ea8fe'/%3E%3Ctext x='50' y='72' font-size='64' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%230b1220'%3E%ED%95%9C%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #0f1115;
  --bg-soft: #161a21;
  --bg-card: #1b2029;
  --bg-raise: #232935;
  --line: #2c333f;
  --line-soft: #232a35;
  --tx: #e8ecf2;
  --tx-dim: #98a2b3;
  --tx-faint: #6b7484;
  --accent: #6ea8fe;
  --accent-dim: #2b4d80;
  --good: #4ec9a5;
  --good-dim: #1e4f42;
  --warn: #e8b84b;
  --bad: #f0736a;
  --bad-dim: #55251f;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --ko: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR",
        "Source Han Sans KR", "NanumGothic", "Nanum Gothic", "Dotum", "Gulim", sans-serif;
}

:root.light {
  --bg: #f6f7f9;
  --bg-soft: #eceef2;
  --bg-card: #ffffff;
  --bg-raise: #f1f3f7;
  --line: #d9dee7;
  --line-soft: #e6e9ef;
  --tx: #1a1f27;
  --tx-dim: #5a6474;
  --tx-faint: #8b95a5;
  --accent: #2563eb;
  --accent-dim: #c7dbff;
  --good: #0e8f6e;
  --good-dim: #cdeee4;
  --warn: #9a6b00;
  --bad: #c8362c;
  --bad-dim: #fbdcd9;
  --shadow: 0 6px 24px rgba(16,24,40,.10);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
/* The three things that most give an installed PWA away as a web page:
   the grey flash on tap, the double-tap-to-zoom delay, and the rubber-band
   overscroll past the top of a list. */
html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
button, a, .chunk, .conv-card, .opt, .tile, .kb-key {
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
body {
  background: var(--bg);
  color: var(--tx);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.ko { font-family: var(--ko); }

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---------- shell ---------- */
#app { max-width: 780px; margin: 0 auto; padding: 0 16px 120px; }

header.top {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 0 14px; position: sticky; top: 0; z-index: 30;
  background: linear-gradient(var(--bg) 70%, transparent);
}
.brand { display: flex; align-items: baseline; gap: 9px; font-weight: 650; letter-spacing: -.01em; }
.brand .mark {
  font-family: var(--ko); font-size: 20px; font-weight: 700;
  background: var(--accent); color: #0b1220; width: 30px; height: 30px;
  display: grid; place-items: center; border-radius: 9px; letter-spacing: 0;
}
:root.light .brand .mark { color: #fff; }
.brand small { color: var(--tx-faint); font-weight: 400; font-size: 12px; }
.spacer { flex: 1; }
.iconbtn {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  color: var(--tx-dim); border: 1px solid transparent;
}
.iconbtn:hover { background: var(--bg-card); color: var(--tx); border-color: var(--line-soft); }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  padding: 7px 13px; border-radius: 999px; color: var(--tx-dim);
  font-size: 13.5px; white-space: nowrap; border: 1px solid transparent;
}
nav.tabs button.on { background: var(--bg-card); color: var(--tx); border-color: var(--line); }
nav.tabs button:hover:not(.on) { color: var(--tx); }

.card {
  background: var(--bg-card); border: 1px solid var(--line-soft);
  border-radius: var(--radius); padding: 18px;
}
.card + .card { margin-top: 14px; }
h2 { font-size: 17px; margin: 0 0 4px; letter-spacing: -.01em; }
h3 { font-size: 14px; margin: 22px 0 8px; color: var(--tx-dim); font-weight: 600;
     text-transform: uppercase; letter-spacing: .07em; }
p.sub { color: var(--tx-dim); margin: 0 0 14px; font-size: 13.5px; }
.muted { color: var(--tx-dim); }
.faint { color: var(--tx-faint); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  white-space: nowrap;
  padding: 11px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14.5px;
  background: var(--bg-raise); border: 1px solid var(--line);
}
.btn:hover { border-color: var(--tx-faint); }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--good));
  color: #0b1220; border-color: transparent;
  box-shadow: 0 2px 14px -4px var(--accent);
}
:root.light .btn.primary { color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.975); }
.btn { transition: transform .1s ease, filter .15s ease; }
.btn.big { width: 100%; padding: 15px; font-size: 16px; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }

.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grid { display: grid; gap: 10px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.grid.three { grid-template-columns: repeat(3, 1fr); }
.grid.four { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }

/* ---------- today ---------- */
.hero {
  text-align: left; position: relative; overflow: hidden;
  background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 60%),
    var(--bg-card);
}
@supports not (background: color-mix(in srgb, red 10%, transparent)) {
  .hero { background: var(--bg-card); }
}
.hero .plan { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
.chip {
  padding: 6px 11px; border-radius: 999px; background: var(--bg-raise);
  border: 1px solid var(--line); font-size: 12.5px; color: var(--tx-dim);
}
.chip b { color: var(--tx); font-variant-numeric: tabular-nums; }
.chip.good { border-color: var(--good-dim); }
.chip.accent { border-color: var(--accent-dim); }

.stat { background: var(--bg-raise); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 13px; }
.stat .n { font-size: 27px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .l { font-size: 11.5px; color: var(--tx-faint); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
.stat .h { font-size: 11.5px; color: var(--tx-faint); margin-top: 6px; line-height: 1.4; }

.bar { height: 7px; border-radius: 99px; background: var(--bg-raise); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.bar > i.good { background: var(--good); }

/* ---------- session ---------- */
.session-wrap { padding-top: 4px; }
.sess-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.sess-head .bar { flex: 1; }
.sess-head .count { font-size: 12px; color: var(--tx-faint); font-variant-numeric: tabular-nums; }

.q-card {
  background: var(--bg-card); border: 1px solid var(--line-soft);
  border-radius: var(--radius); padding: 26px 20px; min-height: 210px;
  display: flex; flex-direction: column; justify-content: center;
}
.q-kind { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--tx-faint); margin-bottom: 14px; }
.q-prompt { font-size: 17px; color: var(--tx-dim); margin-bottom: 10px; }
.q-target { font-family: var(--ko); font-size: 44px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; word-break: keep-all; }
.q-target.small { font-size: 30px; }
.q-target.en { font-family: inherit; font-size: 26px; font-weight: 600; }
.q-rom { color: var(--tx-faint); font-size: 15px; margin-top: 6px; font-family: var(--mono); }
.q-sentence { font-family: var(--ko); font-size: 25px; line-height: 1.6; word-break: keep-all; }
.q-sentence .blank { color: var(--accent); border-bottom: 2px dashed var(--accent-dim); padding: 0 12px; }

.opt {
  display: block; width: 100%; text-align: left; padding: 14px 16px;
  border-radius: var(--radius-sm); background: var(--bg-card);
  border: 1px solid var(--line); font-size: 15.5px; transition: background .12s, border-color .12s;
}
.opt:hover:not(:disabled) { border-color: var(--tx-faint); }
.opt.ko-opt { font-family: var(--ko); font-size: 21px; }
.opt.right { border-color: var(--good); background: var(--good-dim); }
.opt.wrong { border-color: var(--bad); background: var(--bad-dim); }
.opt small { display: block; color: var(--tx-faint); font-size: 12px; font-family: var(--mono); margin-top: 3px; }

.typebox {
  width: 100%; padding: 15px 16px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--line);
  font-size: 26px; font-family: var(--ko); text-align: center; min-height: 62px;
}
.typebox:focus { outline: none; border-color: var(--accent); }
.typebox.rom { font-family: var(--mono); font-size: 21px; }
.typedisplay {
  width: 100%; padding: 15px 16px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--line);
  font-size: 28px; font-family: var(--ko); text-align: center; min-height: 66px;
  display: flex; align-items: center; justify-content: center; cursor: text;
}
.typedisplay.focus { border-color: var(--accent); }
.typedisplay .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--accent); margin-left: 2px; animation: blink 1.1s step-end infinite; vertical-align: -.14em; }
@keyframes blink { 50% { opacity: 0; } }
.typedisplay .ph { color: var(--tx-faint); font-size: 15px; font-family: inherit; }

/* on-screen hangul keyboard */
.kb { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.kb-row { display: flex; gap: 5px; justify-content: center; width: 100%; }
.kb-key {
  flex: 1 1 0; min-width: 0; max-width: 58px; height: 44px; border-radius: 8px;
  background: var(--bg-raise); border: 1px solid var(--line);
  font-family: var(--ko); font-size: 17px; display: grid; place-items: center;
  position: relative; user-select: none;
}
.kb-key:active { background: var(--accent); color: #0b1220; }
.kb-key .lat { position: absolute; top: 2px; right: 4px; font-size: 8.5px; color: var(--tx-faint); font-family: var(--mono); }
.kb-key.wide { max-width: 90px; flex: 1.6 1 0; font-size: 13px; font-family: inherit; }
.kb-hint { font-size: 11.5px; color: var(--tx-faint); text-align: center; margin-top: 4px; }

/* sentence builder */
.build-target { min-height: 66px; padding: 12px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 7px; align-content: flex-start; }
.tile { padding: 9px 13px; border-radius: 9px; background: var(--bg-raise);
  border: 1px solid var(--line); font-family: var(--ko); font-size: 19px; }
.tile:hover { border-color: var(--tx-faint); }
.tile.used { opacity: .25; pointer-events: none; }
.build-pool { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }

/* feedback */
.fb { border-radius: var(--radius-sm); padding: 14px 16px; margin-top: 12px;
      border: 1px solid var(--line); background: var(--bg-card); }
.fb.right { border-color: var(--good-dim); }
.fb.wrong { border-color: var(--bad-dim); }
.fb .verdict { font-weight: 650; font-size: 14px; margin-bottom: 6px; }
.fb.right .verdict { color: var(--good); }
.fb.wrong .verdict { color: var(--bad); }
.fb .answer { font-family: var(--ko); font-size: 24px; margin: 4px 0; }
.fb .note { color: var(--tx-dim); font-size: 13.5px; margin-top: 8px; }
.fb .why { color: var(--tx-dim); font-size: 13px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); }

.gradebar { display: flex; gap: 8px; margin-top: 12px; }
.gradebar button { flex: 1; padding: 10px 6px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--bg-card); font-size: 13px; }
.gradebar button b { display: block; font-size: 10.5px; color: var(--tx-faint); font-weight: 500; margin-top: 2px; }
.gradebar button:hover { border-color: var(--tx-faint); }

/* teach card */
.teach .big-ko { font-family: var(--ko); font-size: 52px; font-weight: 650; line-height: 1.2; }
.teach .rom { font-family: var(--mono); color: var(--tx-faint); font-size: 16px; margin-top: 4px; }
.teach .en { font-size: 21px; margin-top: 10px; }
.teach .tip { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--bg-raise); border: 1px solid var(--line-soft); font-size: 13.5px; color: var(--tx-dim); }
.teach .ex { margin-top: 12px; }
.teach .ex .exko { font-family: var(--ko); font-size: 20px; }
.teach .ex .exen { color: var(--tx-dim); font-size: 13.5px; }

.speak {
  width: 40px; height: 40px; border-radius: 50%; background: var(--bg-raise);
  border: 1px solid var(--line); display: grid; place-items: center; flex: none;
}
.speak:hover { border-color: var(--accent); color: var(--accent); }
.speak.lg { width: 76px; height: 76px; }
.speak svg { width: 18px; height: 18px; }
.speak.lg svg { width: 30px; height: 30px; }

/* ---------- progress ---------- */
.forecast { display: flex; align-items: flex-end; gap: 4px; height: 110px; margin-top: 8px; }
.forecast .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
.forecast .col i { display: block; width: 100%; background: var(--accent-dim); border-radius: 4px 4px 0 0; min-height: 2px; }
.forecast .col.today i { background: var(--accent); }
.forecast .col span { font-size: 9.5px; color: var(--tx-faint); }

.heat { display: grid; grid-template-columns: repeat(auto-fill, 13px); gap: 3px; }
.heat i { width: 13px; height: 13px; border-radius: 3px; background: var(--bg-raise); border: 1px solid var(--line-soft); }
.heat i.l1 { background: var(--accent-dim); }
.heat i.l2 { background: var(--accent-dim); background: color-mix(in srgb, var(--accent) 55%, var(--accent-dim)); }
.heat i.l3 { background: var(--accent); }

table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--tx-faint); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.list td { padding: 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.list td.k { font-family: var(--ko); font-size: 18px; }
table.list tr:hover td { background: var(--bg-raise); }
.pill { font-size: 10.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--tx-dim); }
.pill.new { border-color: var(--line); }
.pill.learn { border-color: var(--warn); color: var(--warn); }
.pill.young { border-color: var(--accent-dim); color: var(--accent); }
.pill.mature { border-color: var(--good-dim); color: var(--good); }

/* ---------- settings ---------- */
.field { display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.field:last-child { border-bottom: none; }
.field .lab { font-size: 14px; }
.field .lab small { display: block; color: var(--tx-faint); font-size: 12px; margin-top: 2px; max-width: 46ch; }
.field .ctl { flex: none; }
select, input[type=number] {
  background: var(--bg-raise); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 14px; color: var(--tx);
}
input[type=range] { width: 160px; accent-color: var(--accent); }
.switch { width: 46px; height: 26px; border-radius: 99px; background: var(--bg-raise);
  border: 1px solid var(--line); position: relative; transition: background .15s; }
.switch i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--tx-faint); transition: transform .15s, background .15s; }
.switch.on { background: var(--accent-dim); border-color: var(--accent); }
.switch.on i { transform: translateX(20px); background: var(--accent); }

.notice { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px;
  border: 1px solid var(--warn); background: var(--bg-raise); color: var(--tx); }
@supports (background: color-mix(in srgb, red 10%, transparent)) {
  .notice { background: color-mix(in srgb, var(--warn) 12%, transparent); }
}
.gradebar button.keep { border-color: var(--accent-dim); }

.prose { font-size: 14.5px; line-height: 1.7; color: var(--tx); }
.prose p { margin: 0 0 14px; }
.prose h4 { font-size: 14.5px; margin: 22px 0 6px; }
.prose em { color: var(--tx-dim); }
.prose code { font-family: var(--mono); font-size: 13px; background: var(--bg-raise);
  padding: 1px 5px; border-radius: 5px; }
.prose .ko { font-size: 16px; }

.unit-h { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.unit-h .n { font-family: var(--mono); font-size: 12px; color: var(--tx-faint); }
.unit-h .t { font-weight: 600; font-size: 15px; }
.unit-body { margin-top: 14px; }
.gram { border-left: 2px solid var(--accent-dim); padding-left: 14px; margin: 14px 0; }
.gram .nm { font-weight: 600; font-size: 14.5px; }
.gram .pt { font-family: var(--mono); font-size: 12.5px; color: var(--tx-dim); margin: 4px 0 8px; }
.gram .ex { font-family: var(--ko); font-size: 17px; margin-top: 6px; }
.gram .ex + .exen { font-size: 13px; color: var(--tx-dim); margin-bottom: 6px; }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: var(--bg-raise); border: 1px solid var(--line); color: var(--tx);
  padding: 11px 18px; border-radius: 99px; font-size: 13.5px; box-shadow: var(--shadow); z-index: 99; }

@media (max-width: 560px) {
  .q-target { font-size: 36px; }
  .q-sentence { font-size: 21px; }
  .grid.four { grid-template-columns: 1fr 1fr; }
  .kb-key { height: 40px; font-size: 15px; }
  #app { padding: 0 12px 120px; }
}

/* ============================================================
   FX LAYER — celebrations, mascot, micro-interactions
   Everything here collapses under prefers-reduced-motion.
   ============================================================ */

#fxlayer {
  position: fixed; inset: 0; z-index: 90;
  pointer-events: none;
}

/* full-screen tint sweep */
.fx-flash {
  position: fixed; inset: 0; z-index: 88; pointer-events: none;
  animation: fxflash .7s ease-out forwards;
}
.fx-flash.good { background: radial-gradient(circle at 50% 45%, rgba(78,201,165,.30), rgba(78,201,165,0) 62%); }
.fx-flash.gold { background: radial-gradient(circle at 50% 45%, rgba(255,209,102,.34), rgba(255,209,102,0) 62%); }
@keyframes fxflash { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }

/* glowing viewport border for the big combos */
.fx-edge {
  position: fixed; inset: 0; z-index: 87; pointer-events: none; border-radius: 2px;
  animation: fxedge .95s ease-out forwards;
}
.fx-edge.good { box-shadow: inset 0 0 0 3px rgba(255,209,102,.85), inset 0 0 70px 12px rgba(255,209,102,.35); }
@keyframes fxedge { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

/* rising combo text */
.fx-float {
  position: fixed; z-index: 92; pointer-events: none;
  font-weight: 800; font-size: 26px; letter-spacing: -.02em;
  color: var(--good); text-shadow: 0 2px 14px rgba(0,0,0,.5);
  transform: translate(-50%, -50%);
  animation: fxfloat 1.2s cubic-bezier(.16,.9,.3,1) forwards;
}
.fx-float.big { font-size: 48px; animation-duration: 1.6s; }
.fx-float.ko { font-family: var(--ko); }
@keyframes fxfloat {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
  18%  { opacity: 1; transform: translate(-50%,-58%) scale(1.22); }
  32%  { transform: translate(-50%,-62%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-140%) scale(1); }
}

/* the big banner */
.fx-banner {
  position: fixed; left: 50%; top: 34%; z-index: 93; pointer-events: none;
  transform: translate(-50%,-50%); text-align: center;
  animation: bnIn .5s cubic-bezier(.2,1.4,.35,1) forwards;
}
.fx-banner.out { animation: bnOut .45s ease-in forwards; }
.fx-banner .bn-main {
  font-size: 54px; font-weight: 900; letter-spacing: -.03em; line-height: 1;
  background: linear-gradient(180deg, #fff8e6 0%, #ffd166 55%, #ff9f43 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1px rgba(0,0,0,.06);
  filter: drop-shadow(0 5px 22px rgba(255,160,60,.55));
}
.fx-banner .bn-main.ko { font-family: var(--ko); }
.fx-banner.small .bn-main { font-size: 36px; }
.fx-banner .bn-sub {
  margin-top: 8px; font-size: 13.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--tx-dim); font-weight: 600;
}
@keyframes bnIn {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(.55) rotate(-4deg); }
  60%  { opacity: 1; transform: translate(-50%,-50%) scale(1.1) rotate(1.5deg); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); }
}
@keyframes bnOut { to { opacity: 0; transform: translate(-50%,-90%) scale(.92); } }

/* app-level shake + pulse */
#app { --shake: 6px; }
.fx-shake { animation: fxshake .5s cubic-bezier(.36,.07,.19,.97); }
@keyframes fxshake {
  10%, 90% { transform: translateX(calc(var(--shake) * -.22)); }
  20%, 80% { transform: translateX(calc(var(--shake) * .42)); }
  30%, 50%, 70% { transform: translateX(calc(var(--shake) * -1)); }
  40%, 60% { transform: translateX(var(--shake)); }
}
.fx-pulse { animation: fxpulse .62s cubic-bezier(.2,1.3,.3,1); }
@keyframes fxpulse { 0%,100% { transform: scale(1); } 35% { transform: scale(1.022); } }

/* ---------- answer feedback ---------- */
.opt.right {
  animation: optRight .55s cubic-bezier(.2,1.5,.35,1);
  box-shadow: 0 0 0 1px var(--good), 0 6px 26px -6px rgba(78,201,165,.6);
}
@keyframes optRight {
  0% { transform: scale(1); } 40% { transform: scale(1.045); } 100% { transform: scale(1); }
}
.opt.wrong { animation: optWrong .42s cubic-bezier(.36,.07,.19,.97); }
@keyframes optWrong {
  20%,80% { transform: translateX(4px); } 40%,60% { transform: translateX(-7px); }
}
.opt { transition: transform .12s ease, background .12s, border-color .12s; }
.opt:active:not(:disabled) { transform: scale(.985); }

.fb { animation: fbIn .42s cubic-bezier(.2,1.2,.35,1); }
@keyframes fbIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.fb.right .answer { animation: ansPop .5s cubic-bezier(.2,1.6,.35,1); }
@keyframes ansPop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.fb .commentary {
  font-size: 15px; font-weight: 650; margin-bottom: 8px; letter-spacing: -.01em;
  animation: fbIn .5s .06s backwards cubic-bezier(.2,1.2,.35,1);
}
.fb.right .commentary { color: var(--good); }
.fb.wrong .commentary { color: var(--warn); }
.fb .commentary .ko { font-family: var(--ko); }

/* animated tick / cross that draws itself */
.verdict-mark { width: 26px; height: 26px; flex: none; }
.verdict-mark path {
  fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 40; stroke-dashoffset: 40;
  animation: draw .45s .05s ease-out forwards;
}
.fb.right .verdict-mark path { stroke: var(--good); }
.fb.wrong .verdict-mark path { stroke: var(--warn); }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* combo chip in the session header */
.combo-chip {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
  border: 1px solid var(--good); color: var(--good); background: var(--good-dim);
  animation: comboPop .38s cubic-bezier(.2,1.7,.35,1);
}
.combo-chip.t2 { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.combo-chip.t3 { border-color: var(--warn); color: var(--warn); background: rgba(232,184,75,.15); }
.combo-chip.t4 {
  border-color: #ff9f43; color: #fff; background: linear-gradient(95deg,#ff9f43,#f0736a,#f78fb3);
  animation: comboPop .38s cubic-bezier(.2,1.7,.35,1), comboGlow 1.1s ease-in-out infinite alternate;
}
@keyframes comboPop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes comboGlow { to { box-shadow: 0 0 18px 2px rgba(255,159,67,.7); } }

/* progress bar shimmer */
.bar > i { position: relative; overflow: hidden; }
.bar > i::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.45) 50%, transparent 80%);
  transform: translateX(-100%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer { to { transform: translateX(220%); } }

/* generic entrance for cards and the question stack */
.q-card { animation: qIn .34s cubic-bezier(.2,1.1,.35,1); }
@keyframes qIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.grid .opt { animation: optIn .34s backwards cubic-bezier(.2,1.1,.35,1); }
.grid .opt:nth-child(1) { animation-delay: .03s; }
.grid .opt:nth-child(2) { animation-delay: .07s; }
.grid .opt:nth-child(3) { animation-delay: .11s; }
.grid .opt:nth-child(4) { animation-delay: .15s; }
@keyframes optIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }

.stat { transition: transform .18s ease, border-color .18s; }
.stat:hover { transform: translateY(-2px); border-color: var(--line); }
.stat.bumped { animation: statBump .6s cubic-bezier(.2,1.5,.35,1); }
@keyframes statBump { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-7px) scale(1.03); } }

.btn { transition: transform .1s ease, filter .15s, border-color .15s; }
.btn:active { transform: scale(.975); }
.btn.primary { box-shadow: 0 5px 18px -6px rgba(110,168,254,.75); }

.tile { transition: transform .12s cubic-bezier(.2,1.5,.35,1), opacity .18s, border-color .12s; }
.tile:active { transform: scale(.93); }
.build-target .tile { animation: tilePop .28s cubic-bezier(.2,1.7,.35,1); }
@keyframes tilePop { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.kb-key { transition: transform .07s ease, background .1s; }
.kb-key:active { transform: scale(.9) translateY(1px); }

.typedisplay { transition: border-color .18s, box-shadow .18s; }
.typedisplay.focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.typedisplay .ko-in { animation: charIn .18s cubic-bezier(.2,1.6,.35,1); display: inline-block; }
@keyframes charIn { from { transform: scale(.5) translateY(4px); opacity: 0; } to { transform: none; opacity: 1; } }

.speak:active { transform: scale(.9); }
.speak { transition: transform .1s ease, border-color .15s, color .15s; }
.speak.playing { animation: speakPulse .8s ease-in-out infinite; border-color: var(--accent); color: var(--accent); }
@keyframes speakPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }

/* ---------- mascot ---------- */
#mascot {
  position: fixed; right: 18px; bottom: 18px; z-index: 91;
  width: 92px; height: 96px; pointer-events: none;
  opacity: 0; transform: translateY(24px) scale(.85);
  transition: opacity .34s ease, transform .34s cubic-bezier(.2,1.4,.35,1);
}
#mascot.visible { opacity: 1; transform: none; }
#mascot svg { width: 100%; height: 100%; overflow: visible; }
#mascot .tg-body { transform-origin: 60px 92px; animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }

/* only one eye set and one mouth set visible at a time */
#mascot .tg-eyes, #mascot .tg-mouth { display: none; }
#mascot.m-idle  .tg-e-open,  #mascot.m-idle  .tg-m-smile { display: block; }
#mascot.m-happy .tg-e-happy, #mascot.m-happy .tg-m-grin  { display: block; }
#mascot.m-wow   .tg-e-wow,   #mascot.m-wow   .tg-m-wow   { display: block; }
#mascot.m-oops  .tg-e-oops,  #mascot.m-oops  .tg-m-oops  { display: block; }
#mascot.m-think .tg-e-think, #mascot.m-think .tg-m-o     { display: block; }
#mascot.m-idle.blinking .tg-e-open { display: none; }
#mascot.m-idle.blinking .tg-e-blink { display: block; }
#mascot .tg-e-blink { display: none; }

#mascot.m-happy .tg-blush, #mascot.m-wow .tg-blush { opacity: .8; }
#mascot .tg-ear-l { transform-origin: 26px 40px; }
#mascot .tg-ear-r { transform-origin: 94px 40px; }
#mascot.m-wow .tg-ear-l { animation: earL .5s ease-out; }
#mascot.m-wow .tg-ear-r { animation: earR .5s ease-out; }
@keyframes earL { 0%,100% { transform: rotate(0); } 40% { transform: rotate(-16deg); } }
@keyframes earR { 0%,100% { transform: rotate(0); } 40% { transform: rotate(16deg); } }

#mascot.bounce { animation: mBounce .6s cubic-bezier(.2,1.5,.35,1); }
@keyframes mBounce { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-16px) scale(1.06); } 60% { transform: translateY(0) scale(.97); } }
#mascot.pop { animation: mPop .72s cubic-bezier(.2,1.6,.35,1); }
@keyframes mPop {
  0% { transform: scale(1) rotate(0); }
  30% { transform: scale(1.24) rotate(-7deg) translateY(-14px); }
  55% { transform: scale(1.05) rotate(6deg) translateY(-4px); }
  100% { transform: scale(1) rotate(0); }
}
#mascot.tilt { animation: mTilt .7s ease-out; }
@keyframes mTilt { 0%,100% { transform: rotate(0); } 45% { transform: rotate(9deg) translateY(4px); } }

#mascot .m-bubble {
  position: absolute; right: 84px; bottom: 46px; white-space: nowrap;
  background: var(--bg-raise); border: 1px solid var(--line); color: var(--tx);
  padding: 7px 12px; border-radius: 14px 14px 4px 14px; font-size: 13.5px; font-weight: 650;
  font-family: var(--ko); box-shadow: var(--shadow);
  opacity: 0; transform: translateY(6px) scale(.85); transform-origin: bottom right;
  transition: opacity .22s ease, transform .28s cubic-bezier(.2,1.6,.35,1);
}
#mascot .m-bubble.on { opacity: 1; transform: none; }

/* the done screen gets its own celebration */
.done-hero { text-align: center; padding: 10px 0 4px; }
.done-hero .dh-num {
  font-size: 62px; font-weight: 900; letter-spacing: -.04em; line-height: 1;
  background: linear-gradient(180deg,#fff8e6,#ffd166 60%,#ff9f43);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 18px rgba(255,160,60,.4));
  animation: bnIn .6s cubic-bezier(.2,1.4,.35,1);
}
.done-hero .dh-lab { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--tx-faint); font-weight: 600; margin-top: 4px; }
.ringwrap { display: grid; place-items: center; position: relative; margin: 4px auto 8px; width: 132px; height: 132px; }
.ringwrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ringwrap circle { fill: none; stroke-width: 10; stroke-linecap: round; }
.ringwrap .trk { stroke: var(--bg-raise); }
.ringwrap .val { stroke: var(--good); stroke-dasharray: 351.86; animation: ringFill 1.1s .15s cubic-bezier(.2,.9,.3,1) backwards; }
.ringwrap .pctxt { position: relative; font-size: 27px; font-weight: 800; letter-spacing: -.02em; }
@keyframes ringFill { from { stroke-dashoffset: 351.86; } }

@media (max-width: 560px) {
  #mascot { width: 64px; height: 68px; right: 10px; bottom: 10px; }
  #mascot .m-bubble { right: 58px; bottom: 34px; font-size: 12px; padding: 5px 9px; }
  .fx-banner .bn-main { font-size: 38px; }
  .done-hero .dh-num { font-size: 48px; }
}

/* Respect the OS setting, and the app's own "off" switch. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
:root.fx-off .fx-flash, :root.fx-off .fx-edge, :root.fx-off .fx-banner, :root.fx-off .fx-float { display: none !important; }
:root.fx-off #mascot { display: none !important; }
:root.fx-off .bar > i::after { display: none; }
:root.fx-off .combo-chip { animation: none; }

/* ---------- weak spots / rebuild cards ---------- */
.contrast {
  margin-top: 14px; padding: 13px 15px; border-radius: var(--radius-sm);
  background: var(--bg-raise); border: 1px solid var(--warn);
}
.contrast .ct-head { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--warn); font-weight: 650; margin-bottom: 8px; }
.contrast .ct-ko { font-family: var(--ko); font-size: 30px; font-weight: 600; line-height: 1.1; }
.contrast .ct-en { font-size: 15px; color: var(--tx-dim); flex: 1; }
.contrast .ct-note { font-size: 12.5px; color: var(--tx-faint); margin-top: 9px; line-height: 1.45; }

.opt.ko-opt.disc { font-size: 26px; text-align: center; padding: 20px 16px; }

/* SPEAKER_SVG and friends are sized by their container everywhere else;
   inside a text button they need holding down to icon size. */
.btn > svg { width: 17px; height: 17px; flex: none; }

/* ============================================================
   CONVERSATIONS
   A dialogue is presented whole, then taken apart chunk by chunk.
   The colours are the point: the same colour on a Korean chunk and
   an English chunk means they are the same piece of meaning, which
   is how you see the grammar without being told a rule.
   ============================================================ */

.conv-list { display: grid; gap: 10px; margin-top: 4px; }
.conv-card {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  background: var(--bg-card); border: 1px solid var(--line-soft);
  border-radius: var(--radius); padding: 14px 15px; transition: border-color .15s, transform .12s;
}
.conv-card:hover:not(:disabled) { border-color: var(--accent-dim); transform: translateY(-1px); }
.conv-card:disabled { opacity: .5; cursor: default; }
.conv-card .cc-n {
  flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--bg-raise); border: 1px solid var(--line); font-family: var(--mono);
  font-size: 12.5px; color: var(--tx-dim);
}
.conv-card.done .cc-n { background: var(--good-dim); border-color: var(--good); color: var(--good); }
.conv-card .cc-t { display: block; font-weight: 600; font-size: 14.5px; }
.conv-card .cc-s { display: block; color: var(--tx-faint); font-size: 12.5px; margin-top: 2px; }
.conv-card .cc-go { color: var(--tx-faint); flex: none; }

.conv-head { display: flex; align-items: flex-start; gap: 12px; }
.conv-head .ch-back { flex: none; }
.scene {
  font-size: 13.5px; color: var(--tx-dim); line-height: 1.6;
  border-left: 2px solid var(--accent-dim); padding-left: 13px; margin: 12px 0 4px;
}

.line {
  display: flex; gap: 10px; padding: 12px 0;
  border-bottom: 1px solid var(--line-soft);
}
.line:last-child { border-bottom: none; }
.line .who {
  flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--ko); font-size: 14px; font-weight: 650;
  background: var(--bg-raise); border: 1px solid var(--line); color: var(--tx-dim);
  object-fit: cover;
}
.line.you .who.me { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
img.who { padding: 0; }

.conv-card .cc-n { position: relative; overflow: visible; padding: 0; }
.conv-card .cc-n img { width: 38px; height: 38px; border-radius: 11px; object-fit: cover; display: block; }
.conv-card .cc-tick {
  position: absolute; right: -5px; bottom: -5px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--good); color: #0b1220; font-size: 11px; font-style: normal; font-weight: 800;
  display: grid; place-items: center; border: 2px solid var(--bg-card);
}
.line .lbody { flex: 1; min-width: 0; }
.line .lname { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--tx-faint); font-weight: 650; margin-bottom: 3px; }
.line .lko { font-family: var(--ko); font-size: 21px; line-height: 1.5; word-break: keep-all; }
.line .lrom { font-family: var(--mono); font-size: 12px; color: var(--tx-faint); margin-top: 3px; }
.line .len { font-size: 13.5px; color: var(--tx-dim); margin-top: 5px; }
.line .len.lit { font-style: italic; color: var(--tx-faint); }
.line .lact { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.line.hidden .lko, .line.hidden .lrom, .line.hidden .len { filter: blur(7px); user-select: none; }

/* chunk mapping */
.chunk {
  border-radius: 5px; padding: 1px 2px; margin: 0 -1px;
  border-bottom: 2px solid transparent; cursor: pointer;
  transition: background .12s, border-color .12s;
}
.chunk.c0 { color: var(--k0); border-bottom-color: var(--k0); }
.chunk.c1 { color: var(--k1); border-bottom-color: var(--k1); }
.chunk.c2 { color: var(--k2); border-bottom-color: var(--k2); }
.chunk.c3 { color: var(--k3); border-bottom-color: var(--k3); }
.chunk.c4 { color: var(--k4); border-bottom-color: var(--k4); }
.chunk.c5 { color: var(--k5); border-bottom-color: var(--k5); }
.chunk.c6 { color: var(--k6); border-bottom-color: var(--k6); }
.chunk.c7 { color: var(--k7); border-bottom-color: var(--k7); }
.chunk.lit { border-bottom-style: dotted; }
.chunk.on { background: var(--bg-raise); }
.chunk.ahead { border-bottom-style: dashed; }
:root {
  --k0: #6ea8fe; --k1: #4ec9a5; --k2: #ffd166; --k3: #f78fb3;
  --k4: #b39ddb; --k5: #7ee8c0; --k6: #ffb457; --k7: #8fd3ff;
}
:root.light {
  --k0: #1f5fd0; --k1: #0b7f61; --k2: #8a6100; --k3: #b03a68;
  --k4: #5f43a6; --k5: #0f7a63; --k6: #8f5000; --k7: #175f8c;
}
.maplit { font-size: 13.5px; line-height: 1.9; color: var(--tx-dim); }
.maplit .chunk { margin-right: 2px; }

.segrow { display: inline-flex; background: var(--bg-raise); border: 1px solid var(--line);
  border-radius: 99px; padding: 2px; gap: 2px; }
.segrow button { padding: 6px 13px; border-radius: 99px; font-size: 12.5px; color: var(--tx-dim); }
.segrow button.on { background: var(--bg-card); color: var(--tx); box-shadow: var(--shadow); }

.convnote {
  margin-top: 12px; padding: 13px 15px; border-radius: var(--radius-sm);
  background: var(--bg-raise); border: 1px solid var(--line-soft);
}
.convnote .cn-t { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--accent); font-weight: 650; margin-bottom: 6px; }
.convnote .cn-b { font-size: 13.5px; line-height: 1.65; color: var(--tx-dim); }
.convnote .cn-b .ko { font-family: var(--ko); font-size: 15px; color: var(--tx); }

/* ============================================================
   SPEAKING — record, compare, score
   ============================================================ */
.mic {
  width: 62px; height: 62px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--bg-raise); border: 1px solid var(--line); color: var(--tx-dim);
  transition: transform .12s, background .15s, color .15s, border-color .15s;
}
.mic svg { width: 25px; height: 25px; }
.mic:hover { color: var(--tx); border-color: var(--accent-dim); }
.mic.rec { background: var(--bad-dim); border-color: var(--bad); color: var(--bad); }
.mic.rec::after {
  content: ''; position: absolute; width: 62px; height: 62px; border-radius: 50%;
  border: 2px solid var(--bad); animation: micPulse 1.4s ease-out infinite;
}
.mic.sm { width: 40px; height: 40px; }
.mic.sm svg { width: 17px; height: 17px; }
.micwrap { position: relative; display: grid; place-items: center; }
@keyframes micPulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.55); opacity: 0; } }

.wave {
  width: 100%; height: 68px; display: block; border-radius: var(--radius-sm);
  background: var(--bg-raise); border: 1px solid var(--line-soft); margin-top: 12px;
}
.wavelab { display: flex; justify-content: space-between; font-size: 11.5px;
  color: var(--tx-faint); margin-top: 5px; }

.score { margin-top: 13px; }
.score .sc-top { display: flex; align-items: baseline; gap: 9px; }
.score .sc-n { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
.score .sc-n.good { color: var(--good); }
.score .sc-n.mid { color: var(--warn); }
.score .sc-n.bad { color: var(--bad); }
.score .sc-l { font-size: 12.5px; color: var(--tx-faint); }
.score .heard { font-family: var(--ko); font-size: 20px; margin-top: 8px; }
.score .heard s { color: var(--bad); text-decoration-thickness: 2px; }
.score .heard b { color: var(--good); font-weight: 600; }

.saybox { text-align: center; padding: 6px 0 2px; }
.saybox .say-ko { font-family: var(--ko); font-size: 34px; font-weight: 600; line-height: 1.35; word-break: keep-all; }
.saybox .say-ko.small { font-size: 25px; }
.saybox .say-en { font-size: 14px; color: var(--tx-dim); margin-top: 8px; }
.saybox .say-rom { font-family: var(--mono); font-size: 12.5px; color: var(--tx-faint); margin-top: 4px; }
.microw { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; }

/* ============================================================
   PHONE SHELL — bottom navigation, safe areas, install prompt
   The tab strip at the top is fine with a mouse and miserable with
   a thumb, so on a narrow screen it moves to the bottom of the
   viewport and grows into real targets.
   ============================================================ */
.tabbar { display: none; }

.installbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  padding: 12px 14px; border-radius: var(--radius); background: var(--bg-card);
  border: 1px solid var(--accent-dim);
}
.installbar .ib-t { flex: 1; font-size: 13.5px; }
.installbar .ib-t small { display: block; color: var(--tx-faint); font-size: 12px; margin-top: 2px; }

@media (max-width: 720px) {
  nav.tabs { display: none; }
  #app { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  header.top { padding-top: max(18px, env(safe-area-inset-top)); }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--bg-soft); border-top: 1px solid var(--line-soft);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter: saturate(1.4) blur(12px);
  }
  .tabbar button {
    display: grid; justify-items: center; gap: 3px; padding: 7px 2px 5px;
    color: var(--tx-faint); font-size: 10.5px; font-weight: 600; border-radius: 12px;
    position: relative;
  }
  .tabbar button svg { width: 21px; height: 21px; stroke-width: 1.7; }
  .tabbar button.on { color: var(--accent); }
  .tabbar button .badge {
    position: absolute; top: 3px; right: 50%; margin-right: -19px;
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px;
    background: var(--warn); color: #1a1f27; font-size: 10px; font-weight: 700;
    display: grid; place-items: center;
  }
  /* The session screen is full-bleed; the tab bar would only get in the way. */
  body.in-session .tabbar { display: none; }
  body.in-session #app { padding-bottom: 40px; }

  .conv-head + .scene { margin-top: 10px; }
  .segrow button { padding: 6px 11px; }
  .card .segrow + .btn, .card .btn + .btn { padding: 8px 13px; font-size: 13px; }
  .line .lko { font-size: 19px; }
  .saybox .say-ko { font-size: 28px; }
  .conv-card { padding: 13px; }
  .btn { padding: 12px 18px; }
  .opt { min-height: 52px; }
}

/* A pointer-coarse screen gets bigger everything, regardless of width. */
@media (pointer: coarse) {
  .speak { min-width: 40px; min-height: 40px; }
  .iconbtn { width: 40px; height: 40px; }
}

/* ============================================================

   One dialogue per unit, using only material that unit and the

   of Mango Languages that actually works: you meet a real exchange
   whole, then it is pulled apart chunk by chunk, and every chunk of
   Korean is colour-linked to the English it corresponds to. Seeing
   저는 sit under "as for me" teaches the topic marker faster than a
   paragraph about topic markers does.

   Each line carries three layers:
     ko   what is said
     en   what it means in normal English
     lit  the word-for-word reading, which is where the grammar shows
   and `c` is the chunk map — [korean, english] pairs which, joined
   in order, must reassemble the line. tools/check.mjs enforces that,
   because a chunk that does not line up silently renders nothing.

   A third element on a chunk marks it as running slightly ahead of
   the curriculum; the UI dashes its underline and glosses it rather
   than pretending you were taught it.
   ============================================================ */

/* ============================================================
   FX — particles, bloom, and a synthesised sound bank
   ------------------------------------------------------------
   All of it procedural: no image files, no audio files, nothing
   fetched. The reward side of a language app is legitimate —
   celebrating a correct answer is feedback. What this file
   deliberately does NOT do is punish a wrong one.
   ============================================================ */

const FX_PALETTE = ['#6ea8fe', '#4ec9a5', '#ffd166', '#f78fb3', '#b39ddb', '#7ee8c0', '#ffb457'];
const FX_JAMO = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅎ', 'ㅏ', 'ㅓ', 'ㅗ', 'ㅜ', 'ㅣ', '한', '빛'];

/* ------------------------------------------------------------
   Sound: a tiny WebAudio synth. Browsers block audio until the
   user interacts, so the context is created lazily and resumed
   on the first gesture.
   ------------------------------------------------------------ */
const Sfx = {
  ctx: null,
  enabled: true,
  volume: 0.5,

  init() {
    if (this.ctx) return this.ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
    return this.ctx;
  },

  resume() {
    const c = this.init();
    if (c && c.state === 'suspended') c.resume().catch(() => {});
  },

  /* One shaped note. `type` picks the waveform, `bend` sweeps the pitch. */
  tone(freq, dur, opts) {
    if (!this.enabled) return;
    const c = this.init();
    if (!c) return;
    opts = opts || {};
    const t0 = c.currentTime + (opts.delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.bend) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.bend), t0 + dur);

    const peak = (opts.gain == null ? 0.28 : opts.gain) * this.volume;
    const attack = opts.attack == null ? 0.008 : opts.attack;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(gain);
    gain.connect(this.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  },

  /* Filtered noise — used for the confetti "whoosh" and soft thuds. */
  noise(dur, opts) {
    if (!this.enabled) return;
    const c = this.init();
    if (!c) return;
    opts = opts || {};
    const frames = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, frames, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    const src = c.createBufferSource();
    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = opts.filter || 'bandpass';
    filt.frequency.value = opts.freq || 1200;
    filt.Q.value = opts.q || 1;
    const gain = c.createGain();
    gain.gain.value = (opts.gain == null ? 0.14 : opts.gain) * this.volume;
    src.connect(filt); filt.connect(gain); gain.connect(this.master);
    src.start(c.currentTime + (opts.delay || 0));
  },

  chord(freqs, dur, opts) {
    freqs.forEach((f, i) => this.tone(f, dur, Object.assign({}, opts, { delay: (opts && opts.delay || 0) + i * (opts && opts.spread || 0.055) })));
  },

  play(name, tier) {
    switch (name) {
      case 'tap':
        this.tone(880, 0.045, { type: 'triangle', gain: 0.07 });
        break;
      case 'key':
        this.tone(1320, 0.03, { type: 'square', gain: 0.035 });
        break;
      case 'pop':
        this.tone(420, 0.13, { type: 'sine', bend: 880, gain: 0.16 });
        break;
      case 'correct': {
        // C major triad, transposed up a step for every combo tier
        const semis = Math.min(12, (tier || 0) * 2);
        const m = Math.pow(2, semis / 12);
        this.chord([523.25 * m, 659.25 * m, 783.99 * m], 0.34, { type: 'triangle', gain: 0.2, spread: 0.05 });
        if (tier >= 2) this.tone(1046.5 * m, 0.5, { type: 'sine', gain: 0.1, delay: 0.16 });
        break;
      }
      case 'big':
        this.chord([523.25, 659.25, 783.99, 1046.5, 1318.5], 0.7, { type: 'triangle', gain: 0.22, spread: 0.07 });
        this.noise(0.55, { freq: 3200, gain: 0.09, delay: 0.02 });
        this.tone(130.81, 0.8, { type: 'sine', gain: 0.18 });
        break;
      case 'firework':
        this.noise(0.3, { freq: 2400, gain: 0.12 });
        [0, 0.14, 0.29].forEach((d, i) => {
          this.noise(0.45, { freq: 1600 + i * 700, gain: 0.09, delay: d + 0.05 });
          this.tone([784, 988, 1175][i], 0.4, { type: 'triangle', gain: 0.13, delay: d });
        });
        break;
      case 'wrong':
        // deliberately gentle: a soft low pair, nothing that reads as a buzzer
        this.tone(196, 0.18, { type: 'sine', gain: 0.15 });
        this.tone(164.81, 0.3, { type: 'sine', gain: 0.13, delay: 0.09 });
        break;
      case 'shown':
        this.tone(392, 0.22, { type: 'sine', gain: 0.12 });
        break;
      case 'levelup':
        this.chord([392, 523.25, 659.25, 783.99, 1046.5], 0.8, { type: 'triangle', gain: 0.2, spread: 0.09 });
        break;
      case 'milestone':
        this.chord([659.25, 830.61, 987.77], 0.6, { type: 'sine', gain: 0.17, spread: 0.06 });
        break;
      case 'whoosh':
        this.noise(0.4, { filter: 'lowpass', freq: 900, gain: 0.1 });
        break;
    }
  }
};

/* ------------------------------------------------------------
   Particle field on a fixed, pointer-transparent canvas that
   lives OUTSIDE #app, so the app's innerHTML re-renders cannot
   interrupt an animation in flight.
   ------------------------------------------------------------ */
const FX = {
  canvas: null, ctx: null, parts: [], raf: null, dpr: 1,
  level: 'full',          // 'full' | 'subtle' | 'off'

  mount() {
    if (this.canvas) return;
    const c = document.createElement('canvas');
    c.id = 'fxlayer';
    document.body.appendChild(c);
    this.canvas = c;
    this.ctx = c.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    if (!this.canvas) return;
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = Math.floor(window.innerWidth * this.dpr);
    this.canvas.height = Math.floor(window.innerHeight * this.dpr);
    this.canvas.style.width = window.innerWidth + 'px';
    this.canvas.style.height = window.innerHeight + 'px';
  },

  get on() { return this.level !== 'off'; },
  get lite() { return this.level === 'subtle'; },

  add(p) {
    if (this.parts.length > 1400) return;
    this.parts.push(p);
    this.start();
  },

  start() {
    if (this.raf) return;
    const step = () => {
      this.raf = null;
      const ctx = this.ctx;
      if (!ctx) return;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      const alive = [];
      for (const p of this.parts) {
        p.life += 1 / 60;
        if (p.life >= p.max) continue;
        const t = p.life / p.max;

        if (p.kind === 'ring') {
          const r = p.r0 + (p.r1 - p.r0) * easeOut(t);
          ctx.globalAlpha = (1 - t) * p.a0;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.w * (1 - t * 0.7);
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
        } else if (p.kind === 'ray') {
          const len = p.len * easeOut(Math.min(1, t * 1.6));
          ctx.globalAlpha = (1 - t) * 0.85;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.w;
          ctx.beginPath();
          ctx.moveTo(p.x + Math.cos(p.ang) * p.r0, p.y + Math.sin(p.ang) * p.r0);
          ctx.lineTo(p.x + Math.cos(p.ang) * (p.r0 + len), p.y + Math.sin(p.ang) * (p.r0 + len));
          ctx.stroke();
        } else if (p.kind === 'bloom') {
          const r = p.r1 * easeOut(t);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(1, r));
          g.addColorStop(0, `rgba(255,255,255,${(1 - t) * 0.5})`);
          g.addColorStop(0.45, `rgba(160,205,255,${(1 - t) * 0.22})`);
          g.addColorStop(1, 'rgba(120,180,255,0)');
          ctx.globalAlpha = 1;
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, r), 0, Math.PI * 2); ctx.fill();
        } else {
          p.vy += p.g / 60;
          p.vx *= p.drag; p.vy *= p.drag;
          p.x += p.vx / 60; p.y += p.vy / 60;
          p.rot += p.vr / 60;
          ctx.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          if (p.kind === 'jamo') {
            ctx.font = `600 ${p.size * 2}px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(p.ch, 0, 0);
          } else if (p.kind === 'star') {
            star(ctx, p.size);
          } else if (p.kind === 'spark') {
            ctx.beginPath(); ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
          } else {
            ctx.fillRect(-p.size / 2, -p.size * 0.32, p.size, p.size * 0.64);
          }
          ctx.restore();
        }
        alive.push(p);
      }
      ctx.globalAlpha = 1;
      this.parts = alive;
      if (this.parts.length) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },

  clear() {
    this.parts = [];
    if (this.ctx) {
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  },

  /* ---- composite effects ---- */

  burst(x, y, opts) {
    if (!this.on) return;
    this.mount();
    opts = opts || {};
    let n = opts.count || 26;
    if (this.lite) n = Math.round(n * 0.35);
    const spread = opts.spread || Math.PI * 2;
    const base = opts.dir == null ? -Math.PI / 2 : opts.dir;
    const power = opts.power || 260;
    const kinds = opts.kinds || ['confetti', 'spark', 'star'];
    for (let i = 0; i < n; i++) {
      const ang = base + (Math.random() - 0.5) * spread;
      const sp = power * (0.45 + Math.random() * 0.75);
      const kind = kinds[Math.floor(Math.random() * kinds.length)];
      this.add({
        kind, x, y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        g: opts.g == null ? 620 : opts.g, drag: 0.985,
        size: (kind === 'jamo' ? 9 : 7) * (0.7 + Math.random() * 0.9) * (opts.scale || 1),
        color: opts.color || FX_PALETTE[Math.floor(Math.random() * FX_PALETTE.length)],
        ch: FX_JAMO[Math.floor(Math.random() * FX_JAMO.length)],
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
        life: 0, max: (opts.max || 1.5) * (0.7 + Math.random() * 0.6)
      });
    }
  },

  ring(x, y, opts) {
    if (!this.on) return;
    this.mount();
    opts = opts || {};
    this.add({
      kind: 'ring', x, y, r0: opts.r0 || 6, r1: opts.r1 || 150,
      w: opts.w || 3, a0: opts.a0 || 0.8,
      color: opts.color || '#6ea8fe', life: 0, max: opts.max || 0.7
    });
  },

  rays(x, y, opts) {
    if (!this.on || this.lite) return;
    this.mount();
    opts = opts || {};
    const n = opts.count || 12;
    for (let i = 0; i < n; i++) {
      this.add({
        kind: 'ray', x, y, ang: (i / n) * Math.PI * 2 + Math.random() * 0.2,
        r0: opts.r0 || 18, len: (opts.len || 90) * (0.6 + Math.random() * 0.8),
        w: opts.w || 3, color: opts.color || '#ffd166', life: 0, max: 0.55
      });
    }
  },

  bloom(x, y, r) {
    if (!this.on || this.lite) return;
    this.mount();
    this.add({ kind: 'bloom', x, y, r1: r || 320, life: 0, max: 0.6 });
  },

  /* Confetti falling from above the viewport, for real celebrations. */
  rain(opts) {
    if (!this.on) return;
    this.mount();
    opts = opts || {};
    let n = opts.count || 130;
    if (this.lite) n = Math.round(n * 0.3);
    const W = window.innerWidth;
    for (let i = 0; i < n; i++) {
      const kind = Math.random() < 0.22 ? 'jamo' : (Math.random() < 0.5 ? 'confetti' : 'star');
      // On the big celebrations the middle third stays clear so the numbers
      // you are meant to read are not buried under confetti.
      let x = Math.random() * W;
      if (opts.avoidCenter) {
        x = Math.random() < 0.5 ? Math.random() * W * 0.34 : W * 0.66 + Math.random() * W * 0.34;
      }
      this.add({
        kind,
        x,
        y: -20 - Math.random() * 300,
        vx: (Math.random() - 0.5) * 90,
        vy: 90 + Math.random() * 180,
        g: 120, drag: 0.999,
        size: (kind === 'jamo' ? 8 : 6.5) * (0.7 + Math.random() * 0.8),
        color: FX_PALETTE[Math.floor(Math.random() * FX_PALETTE.length)],
        ch: FX_JAMO[Math.floor(Math.random() * FX_JAMO.length)],
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 9,
        life: 0, max: 2.3 + Math.random() * 1.1
      });
    }
  },

  fireworks(n) {
    if (!this.on) return;
    this.mount();
    const W = window.innerWidth, H = window.innerHeight;
    for (let i = 0; i < (n || 4); i++) {
      // biased to the outer thirds and the upper half: the middle of the
      // screen is where the words you are meant to be reading live
      const left = Math.random() < 0.5;
      const x = W * (left ? 0.08 + Math.random() * 0.2 : 0.72 + Math.random() * 0.2);
      const y = H * (0.1 + Math.random() * 0.34);
      setTimeout(() => {
        const color = FX_PALETTE[Math.floor(Math.random() * FX_PALETTE.length)];
        this.ring(x, y, { r1: 120, color, w: 2, max: 0.55 });
        this.burst(x, y, { count: 30, power: 260, g: 340, spread: Math.PI * 2, dir: 0, kinds: ['spark', 'star', 'confetti'], max: 1.5 });
      }, i * 250);
    }
  }
};

function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function star(ctx, s) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? s * 0.42 : s;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const fn = i ? 'lineTo' : 'moveTo';
    ctx[fn](Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
}

/* ------------------------------------------------------------
   DOM-side flourishes
   ------------------------------------------------------------ */
function centerOf(sel) {
  const el = typeof sel === 'string' ? document.querySelector(sel) : sel;
  if (!el) return { x: window.innerWidth / 2, y: window.innerHeight * 0.42 };
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function flashScreen(kind) {
  if (!FX.on) return;
  const el = document.createElement('div');
  el.className = 'fx-flash ' + kind;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function shakeApp(strength) {
  if (!FX.on || FX.lite) return;
  const app = document.getElementById('app');
  if (!app) return;
  app.style.setProperty('--shake', (strength || 6) + 'px');
  app.classList.remove('fx-shake');
  void app.offsetWidth;
  app.classList.add('fx-shake');
  setTimeout(() => app.classList.remove('fx-shake'), 520);
}

function pulseApp() {
  if (!FX.on || FX.lite) return;
  const app = document.getElementById('app');
  if (!app) return;
  app.classList.remove('fx-pulse');
  void app.offsetWidth;
  app.classList.add('fx-pulse');
  setTimeout(() => app.classList.remove('fx-pulse'), 620);
}

/* Text that rises and fades from a point — the combo counter, mostly. */
function floatText(text, x, y, opts) {
  if (!FX.on) return;
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'fx-float' + (opts.big ? ' big' : '') + (opts.ko ? ' ko' : '');
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  if (opts.color) el.style.color = opts.color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), opts.big ? 1600 : 1200);
}

function edgeGlow(kind, ms) {
  if (!FX.on || FX.lite) return;
  const el = document.createElement('div');
  el.className = 'fx-edge ' + (kind || 'good');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms || 900);
}

/* Banners show one at a time. Two of them on screen together are
   unreadable, and a combo banner plus a milestone banner is a common
   collision, so they queue instead of stacking. */
let bannerQueue = [];
let bannerBusy = false;

function bannerFx(main, sub, opts) {
  if (!FX.on) return;
  bannerQueue.push({ main, sub, opts: opts || {} });
  if (bannerQueue.length > 2) bannerQueue = bannerQueue.slice(-2);
  drainBanners();
}

function drainBanners() {
  if (bannerBusy || !bannerQueue.length) return;
  const b = bannerQueue.shift();
  const opts = b.opts;
  bannerBusy = true;
  const el = document.createElement('div');
  el.className = 'fx-banner' + (opts.small ? ' small' : '');
  el.innerHTML = `<div class="bn-main${opts.ko ? ' ko' : ''}">${b.main}</div>${b.sub ? `<div class="bn-sub">${b.sub}</div>` : ''}`;
  document.body.appendChild(el);
  const hold = opts.hold || 1200;
  setTimeout(() => el.classList.add('out'), hold);
  setTimeout(() => {
    el.remove();
    bannerBusy = false;
    drainBanners();
  }, hold + 480);
}

/* Called when the next question appears, so nothing covers it. */
function clearBanners() {
  bannerQueue = [];
  bannerBusy = false;
  document.querySelectorAll('.fx-banner').forEach(e => e.remove());
}

const Mascot = {
  el: null,
  moodTimer: null,
  blinkTimer: null,

  mount() {
    if (this.el) return;
    const wrap = document.createElement('div');
    wrap.id = 'mascot';
    wrap.className = 'm-idle';
    wrap.innerHTML = MASCOT_SVG + '<div class="m-bubble"></div>';
    document.body.appendChild(wrap);
    this.el = wrap;
    this.scheduleBlink();
  },

  show(on) {
    this.mount();
    this.el.classList.toggle('visible', !!on);
  },

  scheduleBlink() {
    clearTimeout(this.blinkTimer);
    this.blinkTimer = setTimeout(() => {
      if (this.el && this.el.classList.contains('m-idle')) {
        this.el.classList.add('blinking');
        setTimeout(() => this.el && this.el.classList.remove('blinking'), 150);
      }
      this.scheduleBlink();
    }, 2600 + Math.random() * 3800);
  },

  /* mood: idle | happy | wow | oops | think */
  mood(name, holdMs) {
    this.mount();
    const el = this.el;
    ['m-idle', 'm-happy', 'm-wow', 'm-oops', 'm-think'].forEach(c => el.classList.remove(c));
    el.classList.add('m-' + name);
    el.classList.remove('bounce', 'pop', 'tilt');
    void el.offsetWidth;
    if (name === 'happy') el.classList.add('bounce');
    if (name === 'wow') el.classList.add('pop');
    if (name === 'oops') el.classList.add('tilt');
    clearTimeout(this.moodTimer);
    if (holdMs) this.moodTimer = setTimeout(() => this.mood('idle'), holdMs);
  },

  say(text, ms) {
    this.mount();
    const b = this.el.querySelector('.m-bubble');
    if (!b) return;
    b.textContent = text;
    b.classList.add('on');
    clearTimeout(this._sayTimer);
    this._sayTimer = setTimeout(() => b.classList.remove('on'), ms || 2200);
  }
};

const pick = a => a[Math.floor(Math.random() * a.length)];

function comboTier(n) {
  if (n >= 12) return 4;
  if (n >= 8) return 3;
  if (n >= 5) return 2;
  if (n >= 3) return 1;
  return 0;
}

/* Choose the most specific line that applies. */
function commentaryFor(ctx) {
  const n = ctx.combo || 0;
  if (n >= 12) return pick(COMMENTARY.combo12);
  if (n >= 8) return pick(COMMENTARY.combo8);
  if (n >= 5) return pick(COMMENTARY.combo5);
  if (ctx.nemesis) return pick(COMMENTARY.nemesis);
  if (n >= 3) return pick(COMMENTARY.combo3);
  if (ctx.comeback) return pick(COMMENTARY.comeback);
  if (ctx.close) return pick(COMMENTARY.close);
  if (ctx.skill === 'recall' || ctx.skill === 'cloze') return pick(COMMENTARY.production);
  if (ctx.skill === 'listen') return pick(COMMENTARY.listening);
  if (ctx.fast) return pick(COMMENTARY.fast);
  return pick(COMMENTARY.correct);
}

function commentaryForMiss(shown) {
  return shown ? pick(COMMENTARY.shown) : pick(COMMENTARY.wrong);
}

/* ------------------------------------------------------------
   The payoff. Tier 0 is a modest spark; tier 4 is the works.
   ------------------------------------------------------------ */
function celebrateCorrect(ctx) {
  const tier = comboTier(ctx.combo);
  const anchor = ctx.anchor || '.fb';
  const p = centerOf(anchor);

  Sfx.play('correct', tier);

  const scale = 1 + tier * 0.22;
  FX.ring(p.x, p.y, { r1: 110 + tier * 55, color: tier >= 2 ? '#ffd166' : '#4ec9a5', w: 2 + tier * 0.6 });
  FX.burst(p.x, p.y, {
    count: 18 + tier * 16,
    power: 240 + tier * 90,
    scale,
    spread: Math.PI * (tier >= 2 ? 2 : 1.15),
    dir: tier >= 2 ? 0 : -Math.PI / 2,
    kinds: tier >= 1 ? ['confetti', 'spark', 'star', 'jamo'] : ['spark', 'confetti']
  });

  if (tier >= 1) FX.rays(p.x, p.y, { count: 8 + tier * 3, len: 70 + tier * 30 });
  if (tier >= 2) { FX.bloom(p.x, p.y, 260 + tier * 90); flashScreen('good'); }
  if (tier >= 3) { edgeGlow('good', 1000); pulseApp(); }
  if (tier >= 4) { FX.rain({ count: 60, avoidCenter: true }); FX.fireworks(2); Sfx.play('firework'); }

  if (ctx.combo >= 2) {
    floatText('×' + ctx.combo, p.x + 8, p.y - 30, {
      big: tier >= 2,
      color: ['#4ec9a5', '#6ea8fe', '#ffd166', '#ffb457', '#f78fb3'][tier]
    });
  }

  Mascot.mood(tier >= 2 ? 'wow' : 'happy', 1800);
  Mascot.say(pick(tier >= 2 ? MASCOT_LINES.wow : MASCOT_LINES.happy), 1700);

  // Tier thresholds get a banner, once each, the moment they are crossed
  if (ctx.newTier && tier >= 2) {
    const labels = { 2: ['5 IN A ROW', 'combo ×5'], 3: ['EIGHT STRAIGHT', 'combo ×8'], 4: ['ON FIRE', 'combo ×12'] };
    const L = labels[tier];
    if (L) bannerFx(L[0], L[1], { hold: 900, small: tier === 2 });
  }
}

function celebrateWrong(ctx) {
  Sfx.play(ctx.shown ? 'shown' : 'wrong');
  shakeApp(ctx.shown ? 3 : 6);
  Mascot.mood('oops', 1900);
  Mascot.say(pick(MASCOT_LINES.oops), 1700);
  // no particles, no red explosion — a miss is information, not a failure
}
