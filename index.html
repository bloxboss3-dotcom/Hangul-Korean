  if (t.dataset.pickt != null) { pickTile(parseInt(t.dataset.pickt, 10)); return; }
  if (t.dataset.unpick != null) { sess.build.splice(parseInt(t.dataset.unpick, 10), 1); render(); return; }
  if (t.dataset.grade) { adjustGrade(parseInt(t.dataset.grade, 10)); return; }
  if (t.dataset.drillone) { drillOne(t.dataset.drillone); return; }
  if (t.dataset.resetcard) { resetCard(t.dataset.resetcard); return; }

  const act = t.dataset.act;
  if (act === 'theme') { S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; save(); render(); return; }
  if (act === 'start') { startSession(); return; }
  if (act === 'extra') { startExtra(); return; }
  if (act === 'quit') { if (sess && sess.answered) { finishSession(); } else { view = 'today'; sess = null; render(); } return; }
  if (act === 'stopnow') { finishSession(); return; }
  if (act === 'keepgoing') { sess.askStop = false; sess.overtime = true; sess.budgetMs = Infinity; render(); return; }
  if (act === 'learned') { learnedStep(); return; }
  if (act === 'reteachdone') { advance(); return; }
  if (act === 'drill') { startDrill(t.dataset.kind); return; }
  if (act === 'submit') { submitAnswer(); return; }
  if (act === 'giveup') { giveUp(); return; }
  if (act === 'next') { advance(); return; }
  if (act === 'shift') { kbShift = !kbShift; render(); return; }
  if (act === 'space') { composer.insertRaw(' '); render(); return; }
  if (act === 'bksp') { composer.backspace(); render(); return; }
  if (act === 'demofx') {
    Sfx.resume();
    Mascot.show(true);
    celebrateMilestone({ title: 'DEMO', sub: 'this is the tier-4 payoff', big: true });
    setTimeout(() => Mascot.show(view === 'session' || view === 'done'), 4200);
    return;
  }
  if (act === 'export') { doExport(); return; }
  if (act === 'import') { document.getElementById('importfile').click(); return; }
  if (act === 'reset') { doReset(); return; }

  /* conversations */
  if (act === 'convback') { Voice.cancel(); convo = null; view = 'talk'; render(); return; }
  if (act === 'convmode') { convo.readMode = t.dataset.m; render(); return; }
  if (act === 'convhide') { convo.hidden = !convo.hidden; render(); return; }
  if (act === 'convplay') { playThrough(); return; }
  if (act === 'convrole') { startRoleplay(); return; }
  if (act === 'convread') { convo.mode = 'read'; convo.peek = false; render(); return; }
  if (act === 'convnext') { roleNext(); return; }
  if (act === 'convpeek') { convo.peek = true; render(); return; }

  /* speaking */
  if (act === 'sayStart') { sayStart(t.dataset.saytarget); return; }
  if (act === 'sayStop') { sayStop(); return; }
  if (act === 'sayPlay') { Voice.play(sayRec.url); return; }

  /* installing */
  if (act === 'install') { doInstall(); return; }
  if (act === 'dismissinstall') { installPrompt = null; render(); return; }
  if (act === 'swupdate') { applyUpdate(); return; }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.set) {
    const k = t.dataset.set;
    if (SETTING_BOUNDS[k]) {
      const n = ['dailyNew', 'reviewCap', 'sessionMinutes', 'shakyLimit'].includes(k) ? parseInt(t.value, 10) : parseFloat(t.value);
      // fall through to the shared clamp below
      if (!Number.isFinite(n)) { render(); return; }   // empty or junk: put the old value back
      const [lo, hi] = SETTING_BOUNDS[k];
      S.settings[k] = Math.min(hi, Math.max(lo, n));
    } else {
      S.settings[k] = t.value;
    }
    save(); render();
  }
  if (t.id === 'importfile' && t.files && t.files[0]) doImport(t.files[0]);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.set && t.type === 'range') {
    const k = t.dataset.set;
    const n = parseFloat(t.value);
    if (!Number.isFinite(n)) return;
    const [lo, hi] = SETTING_BOUNDS[k] || [-Infinity, Infinity];
    S.settings[k] = Math.min(hi, Math.max(lo, n));
    const lbl = t.nextElementSibling;
    if (lbl) lbl.textContent = k === 'ttsRate' ? S.settings[k].toFixed(2) + '×'
      : k === 'volume' ? String(Math.round(S.settings[k] * 100))
        : S.settings[k].toFixed(2);
    save();
  }
});

/* physical keyboard: 2-set Korean input + shortcuts */
document.addEventListener('keydown', e => {
  // Roleplay: space to record and stop, enter to move on.
  if (view === 'convo' && convo && convo.mode === 'role') {
    const c = CON();
    const l = c && c.lines[convo.pos];
    if (!l) return;
    if (e.key === 'Enter') { e.preventDefault(); roleNext(); return; }
    if (e.key === ' ' && l.w === c.you) {
      e.preventDefault();
      if (sayRec.phase === 'rec') sayStop(); else sayStart(l.ko);
    }
    return;
  }

  if (view !== 'session' || !sess) return;
  const step = currentStep();
  if (!step) return;

  // The speaking card has no keyboard input of its own, so it gets the same
  // space-to-record shortcut rather than falling through to the jamo handler.
  if (liveEx && liveEx.type === 'say' && !sess.reveal) {
    if (e.key === ' ') {
      e.preventDefault();
      if (sayRec.phase === 'rec') sayStop(); else sayStart(liveEx.answer);
    }
    return;
  }

  if (sess.reveal) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); }
    return;
  }
  if (step.t === 'teach') {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); learnedStep(); }
    return;
  }
  if (step.t === 'reteach') {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); }
    return;
  }
  const ex = liveEx;
  if (!ex) return;

  if (ex.type === 'mc') {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && ex._opts && ex._opts[n - 1] != null) { e.preventDefault(); pickMC(ex._opts[n - 1]); }
    return;
  }
  if (ex.type === 'text' && ex.koInput) {
    if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); composer.backspace(); render(); return; }
    if (e.key === ' ') { e.preventDefault(); composer.insertRaw(' '); render(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[a-zA-Z]$/.test(e.key)) {
      e.preventDefault();
      const jamo = QWERTY_MAP[e.key] || QWERTY_MAP[e.key.toLowerCase()];
      if (jamo) { Sfx.play('key'); composer.input(jamo); render(); }
      return;
    }
    // a system Korean IME sends the jamo/syllable directly
    if (/[가-힣ㄱ-ㆎ]/.test(e.key)) {
      e.preventDefault();
      if (/[ㄱ-ㆎ]/.test(e.key)) composer.input(e.key); else composer.insertRaw(e.key);
      render();
    }
    return;
  }
  if (ex.type === 'build') {
    if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); }
    return;
  }
});

/* ---------------------------------------------------------------
   11. ACTIONS
   --------------------------------------------------------------- */
const firstRungKey = id => ITEMS[id] ? ck(id, ladderFor(ITEMS[id])[0]) : null;

function partnerFor(itemId) {
  const pairs = confusionPairs(2).filter(p => p.a === itemId || p.b === itemId);
  if (!pairs.length) return null;
  return pairs[0].a === itemId ? pairs[0].b : pairs[0].a;
}

/* ------------------------------------------------------------
   Targeted drills. These are not just "show it again" — repeating a
   card you keep failing without changing anything mostly reinforces
   the same broken hook. Each drill re-teaches with full context
   first, then forces a discrimination against whatever it is being
   confused with, and only then asks for production.
   ------------------------------------------------------------ */
function startDrill(kind) {
  unlockSkills();
  const steps = [];
  let title = '';

  if (kind === 'weak') {
    const keys = weakCards().slice(0, 8);
    if (!keys.length) { showToast('No weak spots flagged right now — that is a good thing.'); return; }
    title = 'Weak spots';
    keys.forEach(key => {
      const id = key.split('|')[0];
      const partner = partnerFor(id);
      steps.push({ t: 'reteach', id, contrast: partner });
      if (partner) steps.push({ t: 'card', key: firstRungKey(id), discriminate: partner });
      steps.push({ t: 'card', key });
    });
    // a second pass at a distance, so it is spaced rather than blocked
    const second = keys.map(key => ({ t: 'card', key }));
    shuffle(second);
    steps.push(...second);
  }

  else if (kind === 'confusions') {
    const pairs = confusionPairs(2).slice(0, 6);
    if (!pairs.length) { showToast('No confusion pairs recorded yet.'); return; }
    title = 'Confusions';
    pairs.forEach(pr => {
      steps.push({ t: 'reteach', id: pr.a, contrast: pr.b });
      steps.push({ t: 'card', key: firstRungKey(pr.a), discriminate: pr.b });
      steps.push({ t: 'card', key: firstRungKey(pr.b), discriminate: pr.a });
    });
    const second = [];
    pairs.forEach(pr => {
      second.push({ t: 'card', key: firstRungKey(pr.a), discriminate: pr.b });
      second.push({ t: 'card', key: firstRungKey(pr.b), discriminate: pr.a });
    });
    shuffle(second);
    steps.push(...second);
  }

  else if (kind === 'foundations') {
    // your oldest material, sampled to check it is genuinely still there
    const ids = Object.keys(S.introduced)
      .filter(id => ITEMS[id] && (ITEMS[id].kind === 'word' || ITEMS[id].kind === 'hword' || ITEMS[id].kind === 'letter'))
      .sort((a, b) => S.introduced[a] - S.introduced[b])
      .slice(0, 60);
    const keys = ids.map(firstRungKey).filter(k => k && S.cards[k] && S.cards[k].state !== 'new');
    if (keys.length < 4) { showToast('Not enough settled material yet for a foundations check.'); return; }
    title = 'Foundations check';
    shuffle(keys);
    keys.slice(0, 14).forEach(key => steps.push({ t: 'card', key }));
  }

  else if (kind === 'one' && arguments.length > 1) { /* handled by drillOne */ }

  if (!steps.length) { showToast('Nothing to drill.'); return; }

  cancelFx();
  resetTransient();
  sess = {
    queue: steps, pos: 0, combo: 0, bestCombo: 0, lastTier: 0,
    justMissed: false, pendingFx: null, celebrations: [],
    started: Date.now(), answered: 0, correct: 0, againKeys: new Set(),
    newSeen: 0, plannedNew: 0, plannedReviews: steps.length,
    reveal: null, budgetMs: Infinity, overtime: true,
    drill: kind, drillTitle: title
  };
  view = 'session';
  render();
}

function drillOne(key) {
  const id = key.split('|')[0];
  if (!ITEMS[id]) return;
  const partner = partnerFor(id);
  const steps = [{ t: 'reteach', id, contrast: partner }];
  if (partner) steps.push({ t: 'card', key: firstRungKey(id), discriminate: partner });
  steps.push({ t: 'card', key });
  steps.push({ t: 'card', key });
  cancelFx();
  resetTransient();
  sess = {
    queue: steps, pos: 0, combo: 0, bestCombo: 0, lastTier: 0,
    justMissed: false, pendingFx: null, celebrations: [],
    started: Date.now(), answered: 0, correct: 0, againKeys: new Set(),
    newSeen: 0, plannedNew: 0, plannedReviews: steps.length,
    reveal: null, budgetMs: Infinity, overtime: true,
    drill: 'one', drillTitle: 'Single item'
  };
  view = 'session';
  render();
}

function startExtra() {
  const ids = nextNewItems(5);
  if (!ids.length) { showToast('You have already seen every item in the course.'); return; }
  const steps = ids.map(id => ({ t: 'teach', id }));
  cancelFx();
  resetTransient();
  sess = {
    queue: steps, pos: 0, started: Date.now(), answered: 0, correct: 0,
    againKeys: new Set(), newSeen: 0, plannedNew: ids.length, plannedReviews: 0,
    reveal: null, budgetMs: Infinity, overtime: true
  };
  view = 'session';
  render();
}

function learnedStep() {
  const step = currentStep();
  if (!step || step.t !== 'teach') return;
  const item = ITEMS[step.id];
  if (!S.introduced[step.id]) {
    S.introduced[step.id] = Date.now();
    dayRec(todayKey()).newItems++;
    sess.newSeen++;
  }
  const first = ladderFor(item)[0];
  const key = ck(step.id, first);
  if (!S.cards[key]) S.cards[key] = newCard();
  sess.queue[sess.pos] = { t: 'card', key: key };
  liveEx = null;
  composer.reset();
  sess.build = [];
  save();
  render();
}

function pickMC(picked) {
  const ex = liveEx;
  if (!ex || sess.reveal) return;
  const right = picked === ex.answer;
  if (!right) { try { recordConfusion(ex.item.id, picked); } catch (e) {} }
  const elapsed = Date.now() - exStart;
  const grade = right ? (elapsed < 3200 ? 4 : 3) : 1;
  const line = scoreAnswer(ex, right ? 'right' : 'wrong', elapsed, grade);
  sess.reveal = { picked, result: right ? 'right' : 'wrong', options: ex._opts, line };
  if (ex.speakAfter || ex.revealKo || ex.audioOnly) speak(ex.speakAfter || ex.revealKo || ex.audioOnly);
  render();
}

/* Grade the card, update the combo, and stage the celebration for
   afterRender() — the effects need the feedback element to exist first. */
function scoreAnswer(ex, result, elapsed, grade) {
  const card = S.cards[ex.key];
  const nemesis = !!(card && (card.lapses || 0) >= 3);
  const comeback = !!sess.justMissed;
  const good = result === 'right' || result === 'close';

  gradeCard(ex.key, grade, elapsed);
  sess.lastGradeKey = ex.key;

  if (good) {
    sess.combo++;
    sess.bestCombo = Math.max(sess.bestCombo, sess.combo);
    const tier = comboTier(sess.combo);
    const newTier = tier > sess.lastTier;
    sess.lastTier = tier;
    sess.justMissed = false;
    const ctx = {
      combo: sess.combo, newTier, skill: ex.skill, nemesis, comeback,
      close: result === 'close', fast: elapsed < 3000, anchor: '.fb'
    };
    sess.pendingFx = { kind: 'good', ctx };
    return commentaryFor(ctx);
  }

  sess.combo = 0;
  sess.lastTier = 0;
  sess.justMissed = true;
  sess.pendingFx = { kind: 'bad', ctx: { shown: result === 'shown' } };
  return commentaryForMiss(result === 'shown');
}

function pickTile(i) {
  if (sess.reveal) return;
  if (!sess.build) sess.build = [];
  const ex = liveEx;
  const tile = ex.tiles.find(t => t.i === i);
  if (!tile || sess.build.some(t => t.i === i)) return;
  sess.build.push(tile);
  render();
}

function submitAnswer() {
  const ex = liveEx;
  if (!ex || sess.reveal) return;
  let result, raw;

  if (ex.type === 'build') {
    raw = (sess.build || []).map(t => t.w).join(' ');
    result = normKo(raw) === normKo(ex.answer) ? 'right' : 'wrong';
  } else if (ex.romInput) {
    raw = (document.getElementById('ansbox') || {}).value || '';
    result = checkText(ex, raw);
  } else {
    raw = composer.value;
    result = checkText(ex, raw);
  }

  const elapsed = Date.now() - exStart;
  const grade = result === 'right' ? (elapsed < 5000 ? 4 : 3) : result === 'close' ? 2 : 1;
  const line = scoreAnswer(ex, result, elapsed, grade);
  sess.reveal = { result, raw, options: ex._opts, line };
  if (ex.speakAfter) speak(ex.speakAfter);
  render();
}

function giveUp() {
  const ex = liveEx;
  if (!ex || sess.reveal) return;
  const line = scoreAnswer(ex, 'shown', Date.now() - exStart, 1);
  sess.reveal = { result: 'shown', raw: '', options: ex._opts, line };
  if (ex.speakAfter) speak(ex.speakAfter);
  render();
}

/* Let the learner override the auto-grade — self-report of effort is
   the signal FSRS actually wants, and only they can supply it. */
function adjustGrade(grade) {
  const key = sess && sess.lastGradeKey;
  const undone = S.log[S.log.length - 1];
  if (!key || !undone || undone.key !== key) { advance(); return; }
  S.log.pop();

  const rec = dayRec(todayKey());
  rec.reviews = Math.max(0, rec.reviews - 1);
  if (undone.counted) {
    rec.total = Math.max(0, rec.total - 1);
    if (undone.grade > 1) rec.correct = Math.max(0, rec.correct - 1);
  }
  rec.ms = Math.max(0, rec.ms - Math.min(undone.ms || 0, 120000));
  sess.answered = Math.max(0, sess.answered - 1);
  if (undone.grade > 1) sess.correct = Math.max(0, sess.correct - 1);

  if (undone.before) S.cards[key] = undone.before;
  gradeCard(key, grade, undone.ms, true);
  advance();
}

/* Start an item over from scratch. Sometimes a card has simply been
   learned wrong, and the fastest fix is a clean hook rather than more
   repetitions of the broken one. */
function resetCard(key) {
  const it = cardItem(key);
  if (!it) return;
  const name = it.ko || it.ch || it.spelled || 'this item';
  if (!confirm('Restart ' + name + ' from scratch? Its history and schedule are cleared and it is taught again as new.')) return;
  S.cards[key] = newCard();
  if (S.weakLog[key]) S.weakLog[key].clearedAt = 0;
  Object.keys(S.confusions || {}).forEach(k => {
    const r = S.confusions[k];
    if (r.a === key.split('|')[0] || r.b === key.split('|')[0]) delete S.confusions[k];
  });
  save();
  showToast(name + ' will be taught again from scratch.');
  render();
}

function doExport() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hanbit-progress-' + todayKey() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showToast('Backup downloaded.');
}

function doImport(file) {
  const r = new FileReader();
  r.onload = () => {
    let next;
    try {
      const data = JSON.parse(r.result);
      const obj = v => v && typeof v === 'object' && !Array.isArray(v);
      // Validate the RAW file, not the file merged over the defaults — otherwise
      // any unrelated JSON passes the check and quietly resets everything.
      if (!obj(data) || !obj(data.cards) || !obj(data.settings)) throw new Error('not a Hanbit backup');
      next = deepMerge(structuredCloneSafe(DEFAULTS), data);
      if (!Array.isArray(next.log)) next.log = [];
      if (!obj(next.days)) next.days = {};
      if (!obj(next.introduced)) next.introduced = {};
      Object.keys(next.cards).forEach(k => { if (!obj(next.cards[k])) delete next.cards[k]; });
    } catch (e) {
      showToast('That file could not be read as a Hanbit backup.');
      return;
    }
    // Swap in, prove it renders, and only then let it reach storage.
    const prev = S;
    S = next;
    normalizeSettings();
    resetTransient();
    sess = null; view = 'today';
    try { render(); }
    catch (e) {
      S = prev; render();
      showToast('That backup could not be loaded — your progress is unchanged.');
      return;
    }
    save();
    showToast('Progress restored.');
  };
  r.readAsText(file);
}

function doReset() {
  if (!confirm('Delete all progress and start over? Export a backup first if you might want it back.')) return;
  S = structuredCloneSafe(DEFAULTS);
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  save(); view = 'today'; render();
}

/* ---------------------------------------------------------------
   11b. CONVERSATION ACTIONS
   --------------------------------------------------------------- */
function openConvo(id) {
  const c = CONV_BY_ID[id];
  if (!c) return;
  convo = { id, mode: 'read', readMode: S.settings.litDefault ? 'literal' : 'natural',
    pos: 0, hidden: !!S.settings.hideEnglish, peek: false, scores: [] };
  convRec(id).read++;
  save();
  view = 'convo';
  window.scrollTo(0, 0);
  render();
}

/* Read the whole thing aloud, one line after another, pausing between
   speakers. Hearing it end to end before you take it apart is the point
   of leading with a whole conversation. */
let playTimer = null;
function playThrough() {
  const c = CON();
  if (!c) return;
  clearTimeout(playTimer);
  if (!('speechSynthesis' in window)) { showToast('This browser has no speech synthesis.'); return; }
  window.speechSynthesis.cancel();
  let i = 0;
  const next = () => {
    if (!convo || i >= c.lines.length) return;
    const l = c.lines[i++];
    const u = new SpeechSynthesisUtterance(l.ko);
    u.lang = 'ko-KR';
    u.rate = S.settings.ttsRate;
    const chosen = chosenVoice();
    if (chosen) u.voice = chosen;
    // Nudge the two speakers apart in pitch so a dialogue sounds like two
    // people rather than one person reading a script to themselves.
    u.pitch = l.w === c.you ? 0.92 : 1.08;
    // A gap between turns; without one it runs together into a monologue.
    u.onend = () => { playTimer = setTimeout(next, 550); };
    u.onerror = () => { playTimer = setTimeout(next, 550); };
    window.speechSynthesis.speak(u);
  };
  next();
}

function startRoleplay() {
  const c = CON();
  if (!c) return;
  clearTimeout(playTimer);
  try { window.speechSynthesis.cancel(); } catch (e) {}
  convo.mode = 'role';
  convo.pos = 0;
  convo.peek = false;
  convo.scores = [];
  sayRec = { phase: 'idle', target: '', url: null, env: [], heard: null, score: null, durationMs: 0, err: '' };
  window.scrollTo(0, 0);
  render();
  speakCurrentIfTheirs();
}

/* Their lines play themselves — waiting for you to press play on someone
   else's turn is friction with no teaching value. */
function speakCurrentIfTheirs() {
  const c = CON();
  if (!c || !convo || convo.mode !== 'role') return;
  const l = c.lines[convo.pos];
  if (l && l.w !== c.you) setTimeout(() => speak(l.ko), 260);
}

function roleNext() {
  const c = CON();
  if (!c) return;
  const l = c.lines[convo.pos];
  if (l && l.w === c.you) {
    convo.scores.push(sayRec.target === l.ko && sayRec.phase === 'done' ? sayRec.score : null);
  }
  convo.pos++;
  convo.peek = false;
  sayRec = { phase: 'idle', target: '', url: null, env: [], heard: null, score: null, durationMs: 0, err: '' };

  if (convo.pos >= c.lines.length) {
    const said = convo.scores.filter(s => s != null);
    const avg = said.length ? said.reduce((a, b) => a + b, 0) / said.length : 0;
    const rec = convRec(c.id);
    rec.roleplayed++;
    rec.best = Math.max(rec.best || 0, avg);
    save();
    Sfx.play('milestone');
    if (avg >= 0.85) { FX.rain({ count: 60, avoidCenter: true }); Mascot.mood('wow', 2200); }
  }
  window.scrollTo(0, 0);
  render();
  speakCurrentIfTheirs();
}

/* ---------------------------------------------------------------
   11c. SPEAKING ACTIONS
   --------------------------------------------------------------- */
async function sayStart(target) {
  if (!target || sayRec.phase === 'rec' || sayRec.phase === 'arming') return;
  try { window.speechSynthesis.cancel(); } catch (e) {}
  sayRec = { phase: 'arming', target, url: null, env: [], heard: null, score: null, durationMs: 0, err: '' };
  render();
  try {
    await Voice.start({ listen: S.settings.autoListen && Voice.canListen });
  } catch (e) {
    sayRec.phase = 'idle';
    sayRec.err = (e && e.name === 'NotAllowedError')
      ? 'Microphone access was refused. Your browser keeps that decision per site — reset it from the padlock or ⓘ in the address bar, then try again.'
      : 'Could not open the microphone. Another app may be holding it, or the page is not being served over HTTPS.';
    render();
    return;
  }
  sayRec.phase = 'rec';
  render();
}

async function sayStop() {
  if (sayRec.phase !== 'rec') return;
  sayRec.phase = 'scoring';
  render();

  const out = await Voice.stop();
  sayRec.url = out.url;
  sayRec.env = out.env;
  sayRec.durationMs = out.durationMs;

  if (S.settings.autoListen && Voice.canListen) {
    const alts = await Voice.waitForHeard(2600);
    const best = bestHeard(sayRec.target, alts);
    if (best) { sayRec.heard = best.text; sayRec.score = best.score; }
  }
  sayRec.phase = 'done';
  render();
  gradeSayIfScored();
}

/* A machine score is only allowed to grade the card when there IS one.
   Everything else falls through to the self-grade row, which is the
   honest answer rather than a guess dressed up as a measurement. */
function gradeSayIfScored() {
  if (view !== 'session' || !sess || sess.reveal) return;
  const ex = liveEx;
  if (!ex || ex.type !== 'say' || sayRec.score == null) return;
  const s = sayRec.score;
  const result = s >= 0.85 ? 'right' : s >= 0.6 ? 'close' : 'wrong';
  const grade = s >= 0.85 ? 3 : s >= 0.6 ? 2 : 1;
  const line = scoreAnswer(ex, result, Date.now() - exStart, grade);
  sess.reveal = { result, raw: sayRec.heard || '', line };
  render();
}

function saySelfGrade(g) {
  if (view !== 'session' || !sess || sess.reveal) return;
  const ex = liveEx;
  if (!ex || ex.type !== 'say') return;
  const result = g >= 3 ? 'right' : g === 2 ? 'close' : 'wrong';
  const line = scoreAnswer(ex, result, Date.now() - exStart, g);
  sess.reveal = { result, raw: '', line };
  speak(ex.answer);
  render();
}

/* ---------------------------------------------------------------
   11d. INSTALLING, AND KEEPING ITSELF UP TO DATE
   --------------------------------------------------------------- */
let installPrompt = null;
let swReady = false;
let swWaiting = null;

const standalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  if (view === 'today' || view === 'settings') render();
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  showToast('Hanbit is on your home screen. It will open and work with no signal.');
  render();
});

async function doInstall() {
  if (!installPrompt) return;
  const p = installPrompt;
  installPrompt = null;
  try { p.prompt(); await p.userChoice; } catch (e) {}
  render();
}

function applyUpdate() {
  if (!swWaiting) { location.reload(); return; }
  swWaiting.postMessage('skip-waiting');
  // controllerchange fires once the new worker takes over; reloading before
  // that would just load the old copy again.
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
}

/* Updates should arrive on their own. The only thing that must never be
   interrupted is a session in progress — reloading mid-answer would throw
   away the card you were halfway through — so a waiting update applies
   immediately when you are idle, and otherwise holds until you finish. */
function maybeAutoUpdate() {
  if (!swWaiting) return;
  const busy = view === 'session' || (view === 'convo' && convo && convo.mode === 'role') || sayRec.phase === 'rec';
  if (busy) return;
  showToast('Updating Hanbit…');
  setTimeout(applyUpdate, 700);
}

/* Check for a new version whenever the app is brought back to the
   foreground — an installed PWA can sit for days without a page load,
   which is exactly when it would otherwise go stale. */
function checkForUpdate() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.getRegistration()
    .then(r => r && r.update())
    .catch(() => {});
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      swReady = !!navigator.serviceWorker.controller;
      if (reg.waiting) { swWaiting = reg.waiting; }
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed') {
            swReady = true;
            // Only an update if something was already controlling the page;
            // otherwise this is simply the first install finishing.
            if (navigator.serviceWorker.controller) {
              swWaiting = nw;
              maybeAutoUpdate();
            }
            if (view === 'settings') render();
          }
        });
      });
    }).catch(() => { /* offline support is a bonus, never a blocker */ });
  });
}

/* Deep links from the manifest shortcuts, and the browser's back button
   inside a conversation. */
function applyHash() {
  const h = (location.hash || '').replace('#', '');
  if (['today', 'talk', 'weak', 'progress', 'browse', 'method', 'settings'].includes(h)) {
    view = h;
    return true;
  }
  return false;
}

/* ---------------------------------------------------------------
   12. BOOT
   --------------------------------------------------------------- */
load();
normalizeSettings();
applyHash();
try {
  render();
} catch (e) {
  // A save file we cannot render is worse than no save file — never leave the
  // user staring at a blank page with no way back.
  console.error('starting fresh after a render failure', e);
  S = structuredCloneSafe(DEFAULTS);
  render();
  showToast('Your saved progress could not be read, so Hanbit started fresh.');
}
window.addEventListener('hashchange', () => { if (applyHash()) { convo = null; sess = null; render(); } });
window.addEventListener('beforeunload', () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} });
// Leaving the tab with the mic open is the kind of thing that gets an app
// distrusted, so the stream goes the moment the page is hidden.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (Voice.recording) { Voice.cancel(); sayRec.phase = 'idle'; render(); }
    return;
  }
  // Back in the foreground: pick up anything that shipped while it was away.
  checkForUpdate();
  maybeAutoUpdate();
});

</script>
