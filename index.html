/* ============================================================
   SRS ENGINE — FSRS (Free Spaced Repetition Scheduler)
   ------------------------------------------------------------
   FSRS models memory with three variables per card:
     S — stability:      days until recall probability falls to 90%
     D — difficulty:     1..10, how fast this card leaks
     R — retrievability: current probability you'd recall it now
   It beats the older SM-2 (Anki's classic algorithm) because it
   fits a real forgetting curve instead of multiplying by a fixed
   ease factor, and because it uses *how* you failed, not just
   whether you failed.
   Default weights are the community-optimised FSRS defaults.
   ============================================================ */

const FSRS_W = [
  0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046,
  1.54575, 0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315,
  2.9898, 0.51655, 0.6621
];

const FSRS_F = 19 / 81;   // curve shape constant
const FSRS_C = -0.5;      // curve exponent
const S_MIN = 0.01;
const S_MAX = 36500;

const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

/* Whole calendar days between two instants, in local time. A 24-hour window
   is the wrong test for "is this a new study day": someone who reviews at
   11pm and again at 8am has crossed a day, and someone who reviews twice in
   one evening has not. Anki uses a day rollover for exactly this reason. */
function calendarDaysBetween(aMs, bMs) {
  const a = new Date(aMs), b = new Date(bMs);
  a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

/* Probability you can recall a card t days after its last review. */
function retrievability(t, S) {
  if (!(S > 0)) return 0;
  return Math.pow(1 + FSRS_F * t / S, FSRS_C);
}

/* How many days until retrievability decays to the target. */
function intervalFor(S, targetR) {
  const i = (S / FSRS_F) * (Math.pow(targetR, 1 / FSRS_C) - 1);
  return Math.max(1, i);
}

function initialStability(g) {
  return clamp(FSRS_W[g - 1], S_MIN, S_MAX);
}

function initialDifficulty(g) {
  return clamp(FSRS_W[4] - Math.exp(FSRS_W[5] * (g - 1)) + 1, 1, 10);
}

function nextDifficulty(D, g) {
  const deltaD = -FSRS_W[6] * (g - 3);
  const Dp = D + deltaD * (10 - D) / 9;                 // linear damping near the edges
  // mean reversion toward the "Easy" anchor keeps D from drifting to 10 forever
  return clamp(FSRS_W[7] * initialDifficulty(4) + (1 - FSRS_W[7]) * Dp, 1, 10);
}

function stabilityAfterRecall(D, S, R, g) {
  const tD = 11 - D;                                    // easy cards gain more
  const tS = Math.pow(S, -FSRS_W[9]);                   // already-stable cards gain less
  const tR = Math.exp(FSRS_W[10] * (1 - R)) - 1;        // the core insight: low R at review = big gain
  const hard = g === 2 ? FSRS_W[15] : 1;
  const easy = g === 4 ? FSRS_W[16] : 1;
  const alpha = 1 + tD * tS * tR * hard * easy * Math.exp(FSRS_W[8]);
  return clamp(S * alpha, S_MIN, S_MAX);
}

function stabilityAfterLapse(D, S, R) {
  const dF = Math.pow(D, -FSRS_W[12]);
  const sF = Math.pow(S + 1, FSRS_W[13]) - 1;
  const rF = Math.exp(FSRS_W[14] * (1 - R));
  const sPost = FSRS_W[11] * dF * sF * rF;
  return clamp(Math.min(sPost, S), S_MIN, S_MAX);
}

/* Same-day repeats: a much gentler multiplier than a real interval review. */
function stabilityShortTerm(S, g) {
  return clamp(S * Math.exp(FSRS_W[17] * (g - 3 + FSRS_W[18])), S_MIN, S_MAX);
}

/* Small random spread so cards that were learned together don't
   forever arrive on the same day in one indigestible lump. */
function fuzz(days, rnd) {
  if (days < 2.5) return days;
  const spread = Math.min(Math.max(days * 0.05, 1), 4);
  return Math.max(1, days + (rnd() * 2 - 1) * spread);
}

/* ------------------------------------------------------------
   LEARNING STEPS
   ------------------------------------------------------------
   Raw FSRS hands a brand-new card a ~3-day first interval, which
   means nothing you learned today is due tomorrow — the first two
   or three days of study end up being nothing but new material.
   Anki solves this with learning steps before FSRS takes over,
   and so does this: the first three intervals are capped, and a
   lapse always comes back the next day. S and D keep accumulating
   through FSRS the whole time, so the model is unchanged — only
   the early intervals are held short, on purpose.
   ------------------------------------------------------------ */
const LEARN_CAPS = [1, 3, 6];      // days, by number of distinct DAYS reviewed
const RELEARN_CAP = 1;             // a missed card always returns tomorrow

/* dayReps counts days on which this card was successfully reviewed — not
   reviews. Within-session repetitions must not advance the step, or the
   two or three drills a new card gets would push it to a six-day interval
   on day one and we would be back where we started. */
function intervalCap(card, dayRepsAfter) {
  if (card.state === 'relearning') return RELEARN_CAP;
  if (dayRepsAfter <= LEARN_CAPS.length) return LEARN_CAPS[dayRepsAfter - 1];
  return Infinity;
}

/* ------------------------------------------------------------
   The one function the app calls.
   card: { S, D, due, last, reps, lapses, state }
   grade: 1 Again · 2 Hard · 3 Good · 4 Easy
   opts.capDays: an extra ceiling (used to stop a chronically
                 missed card from drifting out of reach again)
   ------------------------------------------------------------ */
function schedule(card, grade, nowMs, targetR, rnd, opts) {
  rnd = rnd || Math.random;
  // A non-numeric target (stale save, hand-edited backup) would otherwise
  // yield NaN intervals, and a NaN due date never becomes due again.
  targetR = clamp(Number(targetR) || 0.9, 0.70, 0.98);
  grade = [1, 2, 3, 4].includes(grade) ? grade : 3;
  opts = opts || {};
  const out = Object.assign({}, card);
  const DAY = 86400000;
  const wasRelearning = card.state === 'relearning';
  const sameDay = !!card.last && calendarDaysBetween(card.last, nowMs) < 1;
  // Cards saved before dayReps existed fall back to their rep count, so an
  // upgrade never crushes an established card's interval back down to a day.
  const priorDayReps = card.dayReps != null ? card.dayReps : (card.reps || 0);
  const dayRepsAfter = priorDayReps + (sameDay ? 0 : 1);
  const learnCap = intervalCap(card, Math.max(1, dayRepsAfter));

  if (card.state === 'new' || card.S == null) {
    out.S = initialStability(grade);
    out.D = initialDifficulty(grade);
    out.reps = 1;
    out.lapses = grade === 1 ? 1 : 0;
  } else {
    // count a crossed day boundary as a full day, so an overnight review is
    // treated as a real interval review rather than a same-day repeat
    const rawDays = Math.max(0, (nowMs - (card.last || nowMs)) / DAY);
    const calDays = card.last ? Math.max(0, calendarDaysBetween(card.last, nowMs)) : 0;
    const elapsedDays = Math.max(rawDays, calDays);
    const R = retrievability(elapsedDays, card.S);
    out.lastR = R;
    out.D = nextDifficulty(card.D, grade);
    if (elapsedDays < 1) {
      // reviewed again the same day — do not let it inflate stability
      out.S = grade === 1 ? stabilityAfterLapse(out.D, card.S, R) : stabilityShortTerm(card.S, grade);
    } else if (grade === 1) {
      out.S = stabilityAfterLapse(out.D, card.S, R);
    } else {
      out.S = stabilityAfterRecall(out.D, card.S, R, grade);
    }
    out.reps = (card.reps || 0) + 1;
    out.lapses = (card.lapses || 0) + (grade === 1 ? 1 : 0);
  }

  out.last = nowMs;

  if (grade === 1) {
    // Failed cards come back inside the same session, then tomorrow.
    out.state = 'relearning';
    out.due = nowMs + 10 * 60 * 1000;
    out.intervalDays = 0;
  } else {
    // a card in relearning graduates back to review once it passes
    out.state = 'review';
    out.dayReps = dayRepsAfter;
    let ivl = fuzz(intervalFor(out.S, targetR), rnd);
    const extra = Number(opts.capDays);
    const ceiling = Math.min(learnCap, Number.isFinite(extra) && extra > 0 ? extra : Infinity);
    if (Number.isFinite(ceiling)) ivl = Math.min(ivl, ceiling);
    out.intervalDays = Math.max(1, ivl);
    out.due = nowMs + out.intervalDays * DAY;
    out.graduated = !wasRelearning && (card.reps || 0) >= LEARN_CAPS.length;
  }
  return out;
}

/* Predicted recall probability for a card right now — used for the
   honest "what do you actually know" number on the stats screen. */
function currentR(card, nowMs) {
  if (!card || card.state === 'new' || !card.S || !card.last) return 0;
  const t = Math.max(0, (nowMs - card.last) / 86400000);
  return retrievability(t, card.S);
}

/* ============================================================
   WEAK SPOTS — remembering what you keep getting wrong
   ------------------------------------------------------------
   FSRS shortens the interval of a card you miss and then moves
   on. That is correct as scheduling but useless as feedback: it
   never notices that one particular item has been beating you
   for two weeks, it lets that item drift back out to a long
   interval the moment you fluke it once, and it gives you no way
   to attack it deliberately.

   This module adds the missing half:
     · per-card history (attempts, accuracy, streak, last miss)
     · a flag for items that are genuinely not sticking
     · a tighter schedule for flagged items so they cannot
       escape again until they have actually held
     · confusion pairs, because most chronic errors are two
       similar items colliding rather than one item being hard
   ============================================================ */

const WEAK_RULES = {
  window: 8,             // outcomes kept per card for the recent-accuracy test
  minAttempts: 5,        // no judgement before this many attempts
  recentAcc: 0.6,        // flag below this accuracy over the recent window
  lapseTrigger: 4,       // ...or this many misses, but only if
  lifetimeAcc: 0.75,     // ...lifetime accuracy is also poor
  clearStreak: 3,        // consecutive correct answers needed to clear the flag
  clearAcc: 0.7,         // ...with the recent window back above this
  clearStability: 7,     // ...and this much stability, in days
  flaggedCap: 21,        // a flagged card's interval never exceeds this
  flaggedRetention: 0.95 // and it is scheduled to a higher recall target
};

function cardHistory(c) {
  const attempts = c && c.attempts || 0;
  const correct = c && c.correct || 0;
  return {
    attempts, correct,
    acc: attempts ? correct / attempts : null,
    lapses: c && c.lapses || 0,
    streak: c && c.streak || 0,
    lastMiss: c && c.lastMiss || 0,
    recent: recentAcc(c)
  };
}

/* Accuracy over the last few attempts only. Judging a card on its
   lifetime miss COUNT is wrong: a card answered forty times with four
   misses is a 90% card, not a problem card. What matters is whether it
   is failing *now*. */
function recentAcc(c) {
  const h = c && c.hist;
  if (!Array.isArray(h) || h.length < 4) return null;
  return h.reduce((a, b) => a + b, 0) / h.length;
}

/* Is this card genuinely not sticking? Two independent triggers,
   because a card can be missed a lot in absolute terms or simply
   never be right often enough. */
function isStruggling(c) {
  if (!c || c.state === 'new') return false;
  const h = cardHistory(c);
  if (h.attempts < WEAK_RULES.minAttempts) return false;
  if (h.recent !== null && h.recent < WEAK_RULES.recentAcc) return true;
  if (h.lapses >= WEAK_RULES.lapseTrigger && h.acc !== null && h.acc < WEAK_RULES.lifetimeAcc) return true;
  return false;
}

/* Has a flagged card earned its way out? Getting it right once is
   not enough — that is how leeches escape and come back later. */
function hasRecovered(c) {
  if (!c) return false;
  // Three correct in a row, on separate days, with real stability behind it.
  // The streak requirement already implies a healthy recent window, so
  // testing that as well would just make the rule stricter than advertised.
  return (c.streak || 0) >= WEAK_RULES.clearStreak && (c.S || 0) >= WEAK_RULES.clearStability;
}

/* Scheduling policy for a flagged card: shorter ceiling, higher
   recall target. Both push it in front of you more often without
   touching the model itself. */
function weakPolicy(card) {
  if (!card || !card.flagged) return { capDays: Infinity, targetR: null };
  return { capDays: WEAK_RULES.flaggedCap, targetR: WEAK_RULES.flaggedRetention };
}

/* ------------------------------------------------------------
   Confusions. When a wrong answer is picked, the text of that
   wrong answer usually belongs to another item — that is the
   thing actually being confused, and the pair is what needs
   drilling, not either item alone.
   ------------------------------------------------------------ */
function resolveByAnswer(text, exclude) {
  if (!text) return null;
  const norm = s => String(s).trim().toLowerCase();
  const target = norm(text);
  const self = exclude && ITEMS[exclude];
  const selfKo = self ? norm(self.ko || self.ch || '') : null;
  let fallback = null;
  for (const id of SEQUENCE) {
    if (id === exclude) continue;
    const it = ITEMS[id];
    const ko = norm(it.ko || it.ch || '');
    // the same word taught in two places is not a confusion
    if (selfKo && ko === selfKo) continue;
    const hit = norm(it.en || '') === target || ko === target || norm(it.rom || '') === target;
    if (!hit) continue;
    if (S.introduced[id]) return id;      // prefer something already learned
    if (!fallback) fallback = id;
  }
  return fallback;
}

function recordConfusion(itemId, pickedText) {
  const otherId = resolveByAnswer(pickedText, itemId);
  if (!otherId || otherId === itemId) return null;
  const a = ITEMS[itemId], b = ITEMS[otherId];
  if (!a || !b) return null;
  const surf = x => (x.ko || x.ch || '').trim();
  if (surf(a) && surf(a) === surf(b)) return null;
  if (!S.confusions) S.confusions = {};
  const key = [itemId, otherId].sort().join('~');
  const rec = S.confusions[key] || { a: itemId < otherId ? itemId : otherId, b: itemId < otherId ? otherId : itemId, n: 0 };
  rec.n++;
  rec.last = Date.now();
  S.confusions[key] = rec;
  return rec;
}

/* Pairs worth drilling: mixed up more than once, both still known. */
function confusionPairs(minCount) {
  const out = [];
  Object.keys(S.confusions || {}).forEach(k => {
    const r = S.confusions[k];
    if (!r || r.n < (minCount || 2)) return;
    if (!ITEMS[r.a] || !ITEMS[r.b]) return;
    if (!S.introduced[r.a] || !S.introduced[r.b]) return;
    out.push(Object.assign({ key: k }, r));
  });
  return out.sort((x, y) => y.n - x.n);
}

/* ------------------------------------------------------------
   The tracker itself
   ------------------------------------------------------------ */
function weakCards() {
  return Object.keys(S.cards)
    .filter(k => {
      const item = ITEMS[k.split('|')[0]];
      return item && ladderFor(item).includes(cardSkill(k)) && S.cards[k].flagged;
    })
    .sort((a, b) => {
      const ha = cardHistory(S.cards[a]), hb = cardHistory(S.cards[b]);
      const sa = (ha.acc == null ? 1 : ha.acc) - ha.lapses * 0.04;
      const sb = (hb.acc == null ? 1 : hb.acc) - hb.lapses * 0.04;
      return sa - sb;                       // worst first
    });
}

/* Items that were flagged and have since been fixed — worth showing,
   because "you already beat these" is the honest counterweight to a
   list of failures. */
function recoveredCards() {
  return Object.keys(S.weakLog || {})
    .filter(k => S.weakLog[k].clearedAt && S.cards[k] && !S.cards[k].flagged)
    .sort((a, b) => S.weakLog[b].clearedAt - S.weakLog[a].clearedAt);
}

/* Cards not yet flagged but heading that way — a gentle early warning. */
function wobblyCards() {
  return Object.keys(S.cards).filter(k => {
    const c = S.cards[k];
    const item = ITEMS[k.split('|')[0]];
    if (!item || !ladderFor(item).includes(cardSkill(k))) return false;
    if (c.flagged || c.state === 'new') return false;
    const h = cardHistory(c);
    if (h.recent !== null && h.recent < 0.75) return true;
    return h.lapses >= 2 && h.acc !== null && h.acc < 0.85;
  }).sort((a, b) => {
    const ra = cardHistory(S.cards[a]).recent, rb = cardHistory(S.cards[b]).recent;
    return (ra == null ? 1 : ra) - (rb == null ? 1 : rb);
  });
}

/* How much unsettled material is in flight right now. This is what
   gates new material: adding more on top of a big shaky pile is the
   single easiest way to make a schedule collapse. */
function shakyCount() {
  const set = new Set();
  Object.keys(S.cards).forEach(k => {
    const c = S.cards[k];
    const id = k.split('|')[0];
    const item = ITEMS[id];
    if (!item || !ladderFor(item).includes(cardSkill(k))) return;
    if (c.state === 'new') return;
    if (c.flagged || (c.S || 0) < 3) set.add(id);
  });
  return set.size;
}

/* ============================================================
   HANGUL INPUT ENGINE
   ------------------------------------------------------------
   Lets you actually TYPE Korean without installing a system IME,
   using the real 두벌식 (2-set) layout that Koreans use. Typing
   production is the highest-value exercise type there is — free
   recall of a form beats recognising it by a wide margin — so it
   is worth building properly rather than falling back to
   multiple choice.
   ============================================================ */

const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

const VOWEL_SET = new Set(JUNG);

const JUNG_COMBINE = {
  'ㅗㅏ': 'ㅘ', 'ㅗㅐ': 'ㅙ', 'ㅗㅣ': 'ㅚ',
  'ㅜㅓ': 'ㅝ', 'ㅜㅔ': 'ㅞ', 'ㅜㅣ': 'ㅟ',
  'ㅡㅣ': 'ㅢ'
};

const JONG_COMBINE = {
  'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ',
  'ㄹㄱ': 'ㄺ', 'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ',
  'ㄹㅌ': 'ㄾ', 'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ'
};

const JONG_SPLIT = Object.fromEntries(Object.entries(JONG_COMBINE).map(([k, v]) => [v, [k[0], k[1]]]));

/* Standard 두벌식 keyboard. Learning these positions is a real,
   transferable skill — the same layout is on every Korean phone. */
const QWERTY_MAP = {
  q:'ㅂ', w:'ㅈ', e:'ㄷ', r:'ㄱ', t:'ㅅ', y:'ㅛ', u:'ㅕ', i:'ㅑ', o:'ㅐ', p:'ㅔ',
  a:'ㅁ', s:'ㄴ', d:'ㅇ', f:'ㄹ', g:'ㅎ', h:'ㅗ', j:'ㅓ', k:'ㅏ', l:'ㅣ',
  z:'ㅋ', x:'ㅌ', c:'ㅊ', v:'ㅍ', b:'ㅠ', n:'ㅜ', m:'ㅡ',
  Q:'ㅃ', W:'ㅉ', E:'ㄸ', R:'ㄲ', T:'ㅆ', O:'ㅒ', P:'ㅖ'
};

function composeSyllable(cho, jung, jong) {
  const ci = CHO.indexOf(cho);
  const ji = JUNG.indexOf(jung);
  const ti = jong ? JONG.indexOf(jong) : 0;
  if (ci < 0 || ji < 0 || ti < 0) return null;
  return String.fromCharCode(0xAC00 + (ci * 21 + ji) * 28 + ti);
}

class HangulComposer {
  constructor() { this.reset(); }

  reset() {
    this.committed = '';
    this.cho = null;
    this.jung = null;
    this.jong = null;
  }

  get pending() {
    if (this.cho && this.jung) return composeSyllable(this.cho, this.jung, this.jong) || '';
    if (this.cho) return this.cho;
    if (this.jung) return this.jung;
    return '';
  }

  get value() { return this.committed + this.pending; }

  flush() {
    this.committed += this.pending;
    this.cho = this.jung = this.jong = null;
  }

  insertRaw(str) {              // spaces, punctuation, or pasted text
    this.flush();
    this.committed += str;
  }

  /* Feed one jamo. Mirrors how a real Korean IME behaves. */
  input(jamo) {
    if (!jamo) return;
    const isVowel = VOWEL_SET.has(jamo);

    if (isVowel) {
      if (!this.cho && !this.jung) { this.jung = jamo; return; }
      if (this.cho && !this.jung) { this.jung = jamo; return; }
      if (this.cho && this.jung && !this.jong) {
        const combo = JUNG_COMBINE[this.jung + jamo];
        if (combo) { this.jung = combo; return; }
        this.flush(); this.jung = jamo; return;
      }
      if (this.cho && this.jung && this.jong) {
        // the batchim jumps forward to start the next syllable: 각 + ㅏ → 가가
        const split = JONG_SPLIT[this.jong];
        let moved;
        if (split) { this.jong = split[0]; moved = split[1]; }
        else { moved = this.jong; this.jong = null; }
        this.flush();
        this.cho = moved; this.jung = jamo;
        return;
      }
      if (this.jung) {
        const combo = JUNG_COMBINE[this.jung + jamo];
        if (combo) { this.jung = combo; return; }
        this.flush(); this.jung = jamo; return;
      }
    } else {
      if (!this.cho && !this.jung) {
        if (CHO.includes(jamo)) { this.cho = jamo; } else { this.insertRaw(jamo); }
        return;
      }
      if (this.cho && !this.jung) { this.flush(); this.cho = CHO.includes(jamo) ? jamo : null; if (!this.cho) this.insertRaw(jamo); return; }
      if (this.jung && !this.cho) { this.flush(); this.cho = CHO.includes(jamo) ? jamo : null; if (!this.cho) this.insertRaw(jamo); return; }
      if (this.cho && this.jung && !this.jong) {
        if (JONG.includes(jamo)) { this.jong = jamo; return; }
        this.flush();
        this.cho = CHO.includes(jamo) ? jamo : null;
        if (!this.cho) this.insertRaw(jamo);
        return;
      }
      if (this.cho && this.jung && this.jong) {
        const combo = JONG_COMBINE[this.jong + jamo];
        if (combo) { this.jong = combo; return; }
        this.flush(); this.cho = CHO.includes(jamo) ? jamo : null; if (!this.cho) this.insertRaw(jamo); return;
      }
    }
  }

  backspace() {
    if (this.jong) {
      const split = JONG_SPLIT[this.jong];
      this.jong = split ? split[0] : null;
      return;
    }
    if (this.jung) {
      const entry = Object.entries(JUNG_COMBINE).find(([, v]) => v === this.jung);
      this.jung = entry ? entry[0][0] : null;
      return;
    }
    if (this.cho) { this.cho = null; return; }
    if (this.committed) {
      // decompose the last committed syllable so backspace feels native
      const last = this.committed[this.committed.length - 1];
      this.committed = this.committed.slice(0, -1);
      const code = last.charCodeAt(0) - 0xAC00;
      if (code >= 0 && code < 11172) {
        const ti = code % 28, ji = Math.floor(code / 28) % 21, ci = Math.floor(code / 588);
        this.cho = CHO[ci]; this.jung = JUNG[ji];
        if (ti > 0) {
          const jongCh = JONG[ti];
          const split = JONG_SPLIT[jongCh];
          this.jong = split ? split[0] : null;
        }
      }
    }
  }

  setValue(str) {
    this.reset();
    this.committed = str || '';
  }
}

/* Rows for the on-screen keyboard, with a shift layer. */
const KB_ROWS = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m']
];
const KB_SHIFTABLE = new Set(['q','w','e','r','t','o','p']);

/* ============================================================
   한빛 · Hanbit — a Korean trainer built on retrieval practice
   ------------------------------------------------------------
   Design commitments, all of them deliberate:
     · No ads, no accounts, no network calls, no telemetry.
     · No hearts, no timers, no loss framing. Difficulty is the
       point of the exercise, so it must never be punished.
     · Recall before recognition. Typing before tapping.
     · Interleaved item types and topics, never blocked drilling.
     · Expanding within-session lags for anything new.
     · FSRS scheduling between sessions, with honest statistics.
   ============================================================ */

const ALL_CORE_UNITS = UNITS_A.concat(UNITS_B);
const DAY = 86400000;
const STORE_KEY = 'hanbit.v1';

/* ---------------------------------------------------------------
   1. CATALOGUE — flatten the curriculum into an ordered sequence
   --------------------------------------------------------------- */
const ITEMS = {};
const SEQUENCE = [];

function addItem(item) {
  if (ITEMS[item.id]) return;
  ITEMS[item.id] = item;
  SEQUENCE.push(item.id);
}

(function buildCatalogue() {
  HANGUL_UNITS.forEach(u => {
    u.letters.forEach(l => addItem(Object.assign({}, l, {
      id: 'L:' + l.ch, kind: 'letter', stage: 'hangul', unit: u.id, unitTitle: u.title
    })));
    (u.rules || []).forEach(r => addItem(Object.assign({}, r, {
      id: 'R:' + r.spelled, kind: 'rule', stage: 'hangul', unit: u.id, unitTitle: u.title
    })));
    u.words.forEach(w => addItem(Object.assign({}, w, {
      id: 'HW:' + u.id + ':' + w.ko, kind: 'hword', stage: 'hangul', unit: u.id, unitTitle: u.title
    })));
  });

  const seenKo = new Set();
  ALL_CORE_UNITS.forEach(u => {
    const vocab = u.vocab.filter(v => {
      if (seenKo.has(v.ko)) return false;
      seenKo.add(v.ko); return true;
    });
    // A slice of vocabulary first so the grammar point has words to
    // work with, then the grammar, then the rest of the vocabulary.
    const head = vocab.slice(0, Math.min(8, vocab.length));
    const tail = vocab.slice(head.length);
    const mk = v => addItem(Object.assign({}, v, {
      id: 'W:' + u.id + ':' + v.ko, kind: 'word', stage: 'core', unit: u.id, unitTitle: u.title
    }));
    head.forEach(mk);
    u.grammar.forEach(g => addItem(Object.assign({}, g, {
      id: 'G:' + g.id, kind: 'grammar', stage: 'core', unit: u.id, unitTitle: u.title
    })));
    tail.forEach(mk);
  });
})();

const CORE_UNIT_BY_ID = {};
ALL_CORE_UNITS.forEach(u => CORE_UNIT_BY_ID[u.id] = u);
const HANGUL_UNIT_BY_ID = {};
HANGUL_UNITS.forEach(u => HANGUL_UNIT_BY_ID[u.id] = u);

/* Skill ladders. Each rung is a separate scheduled card, unlocked
   only once the rung below it is holding. Recognition is cheap and
   comes first; free production is expensive and comes last. */
const LADDER = {
  letter: ['sound', 'find'],
  hword: ['read', 'meaning'],
  rule: ['rule'],
  word: ['recog', 'listen', 'recall', 'cloze'],
  grammar: ['build']
};

/* A bare jamo read aloud gives you the letter's NAME (ㄱ → "기역"), which
   is not what you want to hear. Wrap it in a real syllable instead. */
function letterSyllable(item) {
  if (item.type === 'vowel') return composeSyllable('ㅇ', item.ch, null);
  if (item.type === 'consonant') return composeSyllable(item.ch, 'ㅏ', null);
  if (item.type === 'batchim') {
    const base = item.ch.charAt(0);
    return composeSyllable('ㅇ', 'ㅏ', base) || null;
  }
  return null;
}

/* Saying it out loud is the strongest retrieval there is and the only
   rung that practises the skill you actually want. It is also the most
   expensive: one more card per item. So it is a setting rather than a
   given — phrases and sentences by default, where speaking pays most,
   and everything if you want the full production load. */
function speakRungFor(item) {
  const mode = S && S.settings ? S.settings.speakRung : 'phrases';
  if (mode === 'off') return false;
  if (item.kind === 'grammar') return true;
  if (mode === 'all') return item.kind === 'word' || item.kind === 'hword';
  return item.kind === 'word' && (item.pos === 'phrase' || !!item.ex);
}

function ladderFor(item) {
  let l = LADDER[item.kind].slice();
  if (item.kind === 'word' && !item.ex) l = l.filter(s => s !== 'cloze');
  if (speakRungFor(item)) l.push('say');
  return l;
}

const SKILL_LABEL = {
  sound: 'Letter → sound', find: 'Sound → letter',
  read: 'Read it aloud', meaning: 'What does it mean',
  rule: 'How is it pronounced',
  recog: 'Meaning', listen: 'Listening', recall: 'Write it in Korean', cloze: 'Fill the gap',
  build: 'Build the sentence', say: 'Say it out loud'
};

/* ---------------------------------------------------------------
   2. STATE
   --------------------------------------------------------------- */
const DEFAULTS = {
  settings: {
    dailyNew: 8,
    reviewCap: 100,
    targetRetention: 0.90,
    sessionMinutes: 25,
    showRomanization: true,
    typingMode: true,
    // 0.85 stretches the waveform enough to make any voice sound synthetic.
    // Near-normal speed sounds far more human; there is a slow-replay button
    // for the moments you actually need it drawn out.
    ttsRate: 0.95,
    ttsVoice: '',
    theme: 'dark',
    skipHangul: false,
    consolidateFirst: true, // hold back new material when too much is shaky
    shakyLimit: 30,
    fxLevel: 'full',        // full | subtle | off
    sound: true,
    volume: 0.5,
    spokenPraise: false,
    speakRung: 'phrases',   // off | phrases | all — where speaking joins the schedule
    autoListen: true,       // check pronunciation automatically when a recording ends
    litDefault: false,      // open a conversation on the literal reading
    hideEnglish: false      // conversation lines start covered, for a listening pass
  },
  milestones: {},          // which one-time celebrations have already fired
  cards: {},          // "itemId|skill" -> card
  confusions: {},      // "idA~idB" -> { a, b, n, last }
  weakLog: {},         // cardKey -> { firstFlagged, timesFlagged, clearedAt }
  introduced: {},      // itemId -> ts
  convo: {},           // conversationId -> { studied, roleplayed, best }
  log: [],             // [{t, key, grade, ms}]
  days: {},            // "YYYY-MM-DD" -> {reviews, newItems, ms, correct, total}
  created: Date.now(),
  version: 1
};

let S = null;          // live state
let toastTimer = null;

/* Every numeric setting is reachable from a text field and from an imported
   file, so both routes get clamped through one table. */
const SETTING_BOUNDS = {
  dailyNew: [0, 40], reviewCap: [1, 500], sessionMinutes: [5, 180],
  targetRetention: [0.70, 0.98], ttsRate: [0.4, 1.5], volume: [0, 1],
  shakyLimit: [5, 200]
};

function normalizeSettings() {
  Object.keys(SETTING_BOUNDS).forEach(k => {
    const [lo, hi] = SETTING_BOUNDS[k];
    const n = Number(S.settings[k]);
    S.settings[k] = Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : DEFAULTS.settings[k];
  });
  if (S.settings.theme !== 'light') S.settings.theme = 'dark';
  ['showRomanization', 'typingMode', 'skipHangul'].forEach(k => { S.settings[k] = !!S.settings[k]; });
  if (typeof S.settings.ttsVoice !== 'string') S.settings.ttsVoice = '';
  if (!['full', 'subtle', 'off'].includes(S.settings.fxLevel)) S.settings.fxLevel = 'full';
  const vol = Number(S.settings.volume);
  S.settings.volume = Number.isFinite(vol) ? Math.min(1, Math.max(0, vol)) : 0.5;
  ['sound', 'spokenPraise', 'autoListen', 'litDefault', 'hideEnglish'].forEach(k => { S.settings[k] = !!S.settings[k]; });
  if (!['off', 'phrases', 'all'].includes(S.settings.speakRung)) S.settings.speakRung = 'phrases';
  if (!S.milestones || typeof S.milestones !== 'object') S.milestones = {};
  if (!S.confusions || typeof S.confusions !== 'object') S.confusions = {};
  if (!S.weakLog || typeof S.weakLog !== 'object') S.weakLog = {};
  if (!S.convo || typeof S.convo !== 'object') S.convo = {};
  S.settings.consolidateFirst = S.settings.consolidateFirst !== false;
  const sl = Number(S.settings.shakyLimit);
  S.settings.shakyLimit = Number.isFinite(sl) ? Math.min(200, Math.max(5, sl)) : 30;
}

/* Push the effect settings down into the FX and audio layers. */
function applyFxSettings() {
  FX.level = S.settings.fxLevel;
  Sfx.enabled = !!S.settings.sound && S.settings.fxLevel !== 'off';
  Sfx.volume = S.settings.volume;
  document.documentElement.classList.toggle('fx-off', S.settings.fxLevel === 'off');
  if (S.settings.fxLevel === 'off') FX.clear();
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { /* private mode */ }
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      S = deepMerge(structuredCloneSafe(DEFAULTS), parsed);
      return;
    } catch (e) { console.warn('save file unreadable, starting fresh', e); }
  }
  S = structuredCloneSafe(DEFAULTS);
}

function structuredCloneSafe(o) { return JSON.parse(JSON.stringify(o)); }

function deepMerge(base, over) {
  Object.keys(over || {}).forEach(k => {
    const v = over[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      deepMerge(base[k], v);
    } else base[k] = v;
  });
  return base;
}

/* Progress lives entirely in localStorage. If the browser refuses to write
   (private window, an embedded frame, storage disabled), the honest thing is to
   say so up front rather than let someone study for a week and lose it. */
let storageOk = true;
(function probeStorage() {
  try {
    localStorage.setItem('hanbit.probe', '1');
    localStorage.removeItem('hanbit.probe');
  } catch (e) { storageOk = false; }
})();

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
    catch (e) { showToast('Could not save to this browser — use Export in Settings to keep your progress.'); }
  }, 250);
}

/* Walk back N calendar days, not N × 86400s — a fixed-millisecond step skips
   or repeats a date at every daylight-saving transition. */
function dayKeyBack(n) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - n);
  return dstr(d.getTime());
}

const dstr = ms => {
  const d = new Date(ms);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
const todayKey = () => dstr(Date.now());

function dayRec(k) {
  if (!S.days[k]) S.days[k] = { reviews: 0, newItems: 0, ms: 0, correct: 0, total: 0 };
  return S.days[k];
}

/* ---------------------------------------------------------------
   3. CARDS
   --------------------------------------------------------------- */
const ck = (itemId, skill) => itemId + '|' + skill;
const cardItem = key => ITEMS[key.split('|')[0]];
const cardSkill = key => key.split('|')[1];

function newCard() {
  return { S: null, D: null, due: Date.now(), last: null, reps: 0, lapses: 0, state: 'new' };
}

function isHolding(card) {
  return card && card.state !== 'new' && (card.reps || 0) >= 2 && (card.S || 0) >= 3;
}

/* Open the next rung of an item's ladder once the current one holds. */
function unlockSkills() {
  Object.keys(S.introduced).forEach(itemId => {
    const item = ITEMS[itemId];
    if (!item) return;
    const ladder = ladderFor(item);
    for (let i = 0; i < ladder.length; i++) {
      const key = ck(itemId, ladder[i]);
      if (S.cards[key]) continue;
      const prev = i === 0 ? null : S.cards[ck(itemId, ladder[i - 1])];
      if (i === 0 || isHolding(prev)) {
        S.cards[key] = newCard();
        if (i > 0) S.cards[key].freshSkill = true;
      }
      break;
    }
  });
}

function eligibleSequence() {
  return SEQUENCE.filter(id => {
    const it = ITEMS[id];
    if (S.settings.skipHangul && it.stage === 'hangul') return false;
    return true;
  });
}

function dueCards(now) {
  const out = [];
  Object.keys(S.cards).forEach(k => {
    const c = S.cards[k];
    const item = ITEMS[k.split('|')[0]];
    if (!item) return;
    // A card whose skill is no longer on the item's ladder (curriculum change,
    // older backup) can never generate an exercise — retire it rather than
    // letting it throw inside render() and wedge every future session.
    if (!ladderFor(item).includes(cardSkill(k))) { delete S.cards[k]; return; }
    if (c.state === 'new') { if (S.introduced[k.split('|')[0]]) out.push(k); return; }
    if (c.due <= now) out.push(k);
  });
  return out.sort((a, b) => {
    const ca = S.cards[a], cb = S.cards[b];
    // flagged cards first — they are the reason a session exists
    if (!!ca.flagged !== !!cb.flagged) return ca.flagged ? -1 : 1;
    // then most-overdue relative to its own interval
    const oa = ca.state === 'new' ? -1e9 : (Date.now() - ca.due) / Math.max(1, (ca.intervalDays || 1) * DAY);
    const ob = cb.state === 'new' ? -1e9 : (Date.now() - cb.due) / Math.max(1, (cb.intervalDays || 1) * DAY);
    return ob - oa;
  });
}

function nextNewItems(n) {
  const out = [];
  const seq = eligibleSequence();
  for (const id of seq) {
    if (out.length >= n) break;
    if (!S.introduced[id]) out.push(id);
  }
  return out;
}

/* Piling new material on top of a big pile of unsettled material is the
   fastest way to make a schedule collapse — and it is exactly what makes
   an app feel like an endless conveyor belt of new words. So new items
   throttle back automatically when too much is still shaky. */
function newAllowance(rec) {
  const base = Math.max(0, S.settings.dailyNew - rec.newItems);
  const shaky = shakyCount();
  const limit = S.settings.shakyLimit;
  if (!S.settings.consolidateFirst) return { allowed: base, shaky, limit, throttle: 'off' };
  if (shaky <= limit) return { allowed: base, shaky, limit, throttle: 'none' };

  // Scale down smoothly rather than slamming to zero. Stopping new material
  // forever is its own failure mode: the app would feel dead, and someone
  // who is struggling still deserves to move, just slowly.
  const over = (shaky - limit) / limit;
  const factor = Math.max(0.15, 1 - over);
  const floor = S.settings.dailyNew > 0 ? 1 : 0;
  const allowed = Math.min(base, Math.max(floor, Math.round(S.settings.dailyNew * factor)));
  return { allowed, shaky, limit, throttle: factor <= 0.3 ? 'minimal' : 'reduced', factor };
}

function plan() {
  unlockSkills();
  const now = Date.now();
  const due = dueCards(now);
  const rec = dayRec(todayKey());
  const allow = newAllowance(rec);
  const newIds = nextNewItems(allow.allowed);
  const capped = due.slice(0, S.settings.reviewCap);
  const yesterday = dayKeyBack(1);
  return {
    due: capped,
    dueTotal: due.length,
    fromYesterday: capped.filter(k => S.cards[k].last && dstr(S.cards[k].last) === yesterday).length,
    flaggedDue: capped.filter(k => S.cards[k].flagged).length,
    newIds,
    allow,
    remainingInCourse: eligibleSequence().filter(id => !S.introduced[id]).length
  };
}

/* ---------------------------------------------------------------
   4. SESSION
   --------------------------------------------------------------- */
let sess = null;

/* Celebrations are scheduled with timers, so finishing one session and
   immediately starting another could rain confetti over the new question.
   Every deferred effect goes through here so it can be cancelled. */
let fxTimers = [];
function scheduleFx(fn, ms) { fxTimers.push(setTimeout(fn, ms)); }
function cancelFx() {
  fxTimers.forEach(clearTimeout);
  fxTimers = [];
  clearBanners();
  FX.clear();
}

/* liveEx / composer / exStart / kbShift live outside the state object so that
   re-rendering does not disturb a half-typed answer. That means every entry and
   exit point has to clear them, or one question's input leaks into the next. */
function resetTransient() {
  liveEx = null;
  composer.reset();
  kbShift = false;
  exStart = Date.now();
}

function startSession() {
  const p = plan();
  const steps = [];
  p.due.forEach(k => steps.push({ t: 'card', key: k }));
  shuffle(steps);

  // Spread the new items evenly through the review queue rather than
  // front-loading them: interleaving beats blocking for retention.
  const teach = p.newIds.map(id => ({ t: 'teach', id }));
  const merged = [];
  if (teach.length === 0) {
    merged.push(...steps);
  } else {
    const gap = Math.max(1, Math.floor(steps.length / teach.length) || 1);
    let si = 0, ti = 0;
    while (si < steps.length || ti < teach.length) {
      for (let g = 0; g < gap && si < steps.length; g++) merged.push(steps[si++]);
      if (ti < teach.length) merged.push(teach[ti++]);
    }
  }

  if (!merged.length) {
    view = 'today'; sess = null;
    showToast('Nothing is due right now.');
    render();
    return;
  }

  cancelFx();
  resetTransient();
  sess = {
    queue: merged,
    pos: 0,
    combo: 0,
    bestCombo: 0,
    lastTier: 0,
    justMissed: false,
    pendingFx: null,
    celebrations: [],
    started: Date.now(),
    answered: 0,
    correct: 0,
    againKeys: new Set(),
    newSeen: 0,
    plannedNew: p.newIds.length,
    plannedReviews: p.due.length,
    reveal: null,
    lastGradeKey: null,
    budgetMs: S.settings.sessionMinutes * 60000,
    overtime: false
  };
  view = 'session';
  render();
}

function currentStep() {
  if (!sess) return null;
  while (sess.pos < sess.queue.length) {
    const st = sess.queue[sess.pos];
    if (st.t === 'card' && !S.cards[st.key]) { sess.pos++; continue; }
    return st;
  }
  return null;
}

function insertAt(offset, step) {
  const i = Math.min(sess.queue.length, sess.pos + offset);
  sess.queue.splice(i, 0, step);
}

function advance() {
  clearBanners();                 // never let a celebration cover the next question
  fxTimers.forEach(clearTimeout);
  fxTimers = [];
  sess.pos++;
  sess.reveal = null;
  liveEx = null;
  sess.build = [];
  composer.reset();
  kbShift = false;
  if (!currentStep()) { finishSession(); return; }
  if (!sess.overtime && Date.now() - sess.started > sess.budgetMs) {
    sess.askStop = true;
  }
  render();
}

function gradeCard(key, grade, elapsedMs, noRequeue) {
  const card = S.cards[key] || newCard();
  const before = JSON.parse(JSON.stringify(card));
  const wasNew = card.state === 'new';

  // A flagged card is scheduled to a higher recall target with a hard
  // ceiling on its interval, so it cannot drift back out of reach.
  const pol = weakPolicy(card);
  const targetR = pol.targetR || S.settings.targetRetention;
  const updated = schedule(card, grade, Date.now(), targetR, null, { capDays: pol.capDays });
  delete updated.freshSkill;

  // running history — this is what the tracker reads
  updated.attempts = (card.attempts || 0) + 1;
  updated.correct = (card.correct || 0) + (grade > 1 ? 1 : 0);
  updated.streak = grade > 1 ? (card.streak || 0) + 1 : 0;
  updated.hist = (Array.isArray(card.hist) ? card.hist : []).concat(grade > 1 ? 1 : 0).slice(-WEAK_RULES.window);
  if (grade === 1) updated.lastMiss = Date.now();

  const wasFlagged = !!card.flagged;
  if (!wasFlagged && isStruggling(updated)) {
    updated.flagged = true;
    const log = S.weakLog[key] || { firstFlagged: Date.now(), timesFlagged: 0 };
    log.timesFlagged++;
    log.clearedAt = 0;
    S.weakLog[key] = log;
    if (sess) sess.newlyFlagged = (sess.newlyFlagged || 0) + 1;
  } else if (wasFlagged && hasRecovered(updated)) {
    updated.flagged = false;
    if (S.weakLog[key]) S.weakLog[key].clearedAt = Date.now();
    if (sess) sess.celebrations.push({
      title: 'FIXED', sub: 'a weak spot just cleared — three straight and holding', big: false
    });
  } else {
    updated.flagged = wasFlagged;
  }

  S.cards[key] = updated;

  const rec = dayRec(todayKey());
  rec.reviews++;
  rec.ms += Math.min(elapsedMs || 0, 120000);
  if (sess && !noRequeue) { try { checkMilestones(key, before, updated); } catch (e) {} }
  if (!wasNew) { rec.total++; if (grade > 1) rec.correct++; }
  S.log.push({ t: Date.now(), key, grade, ms: Math.min(elapsedMs || 0, 120000), before, counted: !wasNew });
  // The pre-review snapshot only exists so the grade chips can rewind the
  // last answer. Keeping one per entry would bloat the save file for nothing.
  if (S.log.length > 1) delete S.log[S.log.length - 2].before;
  if (S.log.length > 3000) S.log = S.log.slice(-2200);

  sess.answered++;
  if (grade > 1) sess.correct++;

  // Expanding within-session repetition. Newly learned material gets a
  // second and third retrieval at growing lags; failures come back soon.
  const reps = updated.reps || 0;
  if (noRequeue) { save(); return; }
  if (grade === 1) {
    // Two extra attempts per card per session is plenty; without a cap, a user
    // who keeps pressing "Show me" would extend the queue forever.
    sess.relearns = sess.relearns || {};
    sess.relearns[key] = (sess.relearns[key] || 0) + 1;
    if (sess.relearns[key] <= 2) insertAt(4, { t: 'card', key, relearn: true });
    sess.againKeys.add(key);
  } else if (wasNew && reps === 1) {
    insertAt(3, { t: 'card', key, drill: 2 });
  } else if (sess.queue[sess.pos] && sess.queue[sess.pos].drill === 2) {
    insertAt(9, { t: 'card', key, drill: 3 });
  }
  save();
}

/* One-time celebrations, detected right after a card is graded. */
function checkMilestones(key, before, after) {
  const item = cardItem(key);
  const label = item ? (item.ko || item.ch || item.spelled || item.name || '') : '';

  // a card crossing three weeks of stability is the real "learned it" moment
  if (before && before.S && before.S < 21 && after.S >= 21 && item) {
    sess.celebrations.push({
      title: label, sub: 'now a mature card — stable for weeks', ko: true, big: false
    });
  }

  const held = stats().wordsKnown;
  for (const m of WORD_MILESTONES) {
    if (held >= m && !S.milestones['w' + m]) {
      S.milestones['w' + m] = Date.now();
      sess.celebrations.push({
        title: m + ' WORDS', sub: 'holding in long-term memory', big: m >= 50
      });
      break;
    }
  }

  // finishing every item in a unit
  if (item && item.unit && !S.milestones['u' + item.unit]) {
    const ids = SEQUENCE.filter(id => ITEMS[id].unit === item.unit);
    if (ids.length && ids.every(id => S.introduced[id])) {
      S.milestones['u' + item.unit] = Date.now();
      sess.celebrations.push({
        title: item.unit + ' COMPLETE', sub: item.unitTitle, big: true
      });
    }
  }
}

function finishSession() {
  setTimeout(maybeAutoUpdate, 1500);
  if (!sess) { view = 'today'; render(); return; }
  const acc = sess.answered ? sess.correct / sess.answered : 0;
  sess.perfect = sess.answered >= 8 && sess.correct === sess.answered;
  sess.doneFx = sess.perfect ? 'perfect' : acc >= 0.9 ? 'great' : 'ok';
  save();
  view = 'done';
  render();
}

/* ---------------------------------------------------------------
   5. EXERCISE GENERATION
   --------------------------------------------------------------- */
function pool(pred, exclude, n) {
  const ids = SEQUENCE.filter(id => id !== exclude && pred(ITEMS[id]));
  shuffle(ids);
  return ids.slice(0, n).map(id => ITEMS[id]);
}

function makeExercise(key, step) {
  const item = cardItem(key);
  const skill = cardSkill(key);
  const ex = { key, item, skill, kind: item.kind };

  /* A forced choice between the two items you actually mix up. Putting
     them side by side is what breaks a confusion — drilling either one
     alone just trains it back into the same collision. */
  if (step && step.discriminate && ITEMS[step.discriminate]) {
    const other = ITEMS[step.discriminate];
    const aKo = item.ko || item.ch || '';
    const bKo = other.ko || other.ch || '';
    const meaning = item.en || item.sound || '';
    ex.type = 'mc';
    ex.discriminate = true;
    ex.prompt = 'These two keep getting mixed up. Which one means this?';
    ex.target = meaning;
    ex.targetEn = true;
    ex.answer = aKo;
    ex.options = shuffle([aKo, bKo]);
    ex.koOptions = true;
    ex.why = 'You have confused ' + aKo + ' (' + (item.en || '') + ') with ' + bKo + ' (' + (other.en || '') + ') before. '
      + (item.rom && other.rom ? 'Sounds: ' + item.rom + ' vs ' + other.rom + '.' : '');
    ex.speakAfter = aKo;
    return ex;
  }

  /* Speaking is the same exercise whatever the item is: here is a meaning,
     produce the Korean out loud. What differs is only where the target
     sentence comes from. */
  if (skill === 'say') {
    ex.type = 'say';
    if (item.kind === 'grammar') {
      const sample = item.examples[Math.floor(Math.random() * item.examples.length)];
      ex.answer = sample.ko;
      ex.target = sample.en;
      ex.why = item.name + ' — ' + item.pattern;
    } else if (item.ex && Math.random() < 0.5) {
      // Half the time say the whole example sentence rather than the bare
      // word: a word you can only produce in isolation is not usable yet.
      ex.answer = item.ex.ko;
      ex.target = item.ex.en;
    } else {
      ex.answer = item.ko;
      ex.target = item.en;
    }
    // No romanisation here on purpose — printing the sounds of the answer
    // above the microphone would make this a reading exercise.
    ex.prompt = 'Say this in Korean, out loud.';
    ex.targetEn = true;
    ex.speakAfter = ex.answer;
    return ex;
  }

  if (item.kind === 'letter') {
    if (skill === 'sound') {
      ex.type = 'mc';
      ex.prompt = 'Which sound is this letter?';
      ex.target = item.ch;
      ex.answer = item.rom;
      ex.options = uniqBy([item.rom].concat(pool(i => i.kind === 'letter' && i.type === item.type, item.id, 6).map(i => i.rom)), x => x).slice(0, 4);
      if (ex.options.length < 4) ex.options = ex.options.concat(pool(i => i.kind === 'letter', item.id, 4).map(i => i.rom)).filter(uniqFilter()).slice(0, 4);
      ex.mono = true;
    } else {
      ex.type = 'mc';
      ex.prompt = 'Which letter makes this sound?';
      ex.target = item.rom;
      ex.targetIsRom = true;
      ex.answer = item.ch;
      ex.options = uniqBy([item.ch].concat(pool(i => i.kind === 'letter' && i.type === item.type, item.id, 6).map(i => i.ch)), x => x).slice(0, 4);
      ex.koOptions = true;
    }
    ex.speakAfter = letterSyllable(item) || '';
  }

  else if (item.kind === 'hword') {
    if (skill === 'read') {
      ex.type = 'text';
      ex.prompt = 'Read this out loud, then type it in letters (romanisation).';
      ex.target = item.ko;
      ex.answer = item.rom;
      ex.romInput = true;
      ex.speakAfter = item.ko;
    } else {
      ex.type = 'mc';
      ex.prompt = 'What does this mean?';
      ex.target = item.ko;
      ex.sub = S.settings.showRomanization ? item.rom : '';
      ex.answer = item.en;
      ex.options = uniqBy([item.en].concat(pool(i => i.kind === 'hword', item.id, 8).map(i => i.en)), x => x).slice(0, 4);
      ex.speakAfter = item.ko;
    }
  }

  else if (item.kind === 'rule') {
    ex.type = 'mc';
    ex.prompt = 'This is the spelling. How is it actually pronounced?';
    ex.target = item.spelled;
    ex.sub = item.gloss;
    ex.answer = item.spoken;
    const others = pool(i => i.kind === 'rule', item.id, 6).map(i => i.spoken);
    ex.options = uniqBy([item.spoken, item.spelled].concat(others), x => x).slice(0, 4);
    ex.koOptions = true;
    ex.why = item.name + ' — ' + item.why;
    ex.speakAfter = item.spelled;
  }

  else if (item.kind === 'word') {
    if (skill === 'recog') {
      ex.type = 'mc';
      ex.prompt = 'What does this mean?';
      ex.target = item.ko;
      ex.sub = S.settings.showRomanization ? item.rom : '';
      ex.answer = item.en;
      ex.options = uniqBy([item.en].concat(
        pool(i => i.kind === 'word' && i.pos === item.pos, item.id, 8).map(i => i.en)
      ), x => x).slice(0, 4);
      if (ex.options.length < 4) ex.options = uniqBy(ex.options.concat(pool(i => i.kind === 'word', item.id, 8).map(i => i.en)), x => x).slice(0, 4);
      ex.speakAfter = item.ko;
    } else if (skill === 'listen') {
      ex.type = 'mc';
      ex.prompt = 'Listen. What word is it?';
      ex.audioOnly = item.ko;
      ex.answer = item.en;
      ex.options = uniqBy([item.en].concat(pool(i => i.kind === 'word', item.id, 8).map(i => i.en)), x => x).slice(0, 4);
      ex.revealKo = item.ko;
    } else if (skill === 'recall') {
      ex.type = 'text';
      ex.prompt = 'Write this in Korean.';
      ex.target = item.en;
      ex.targetEn = true;
      ex.answer = item.ko;
      ex.koInput = true;
      ex.hint = item.pos === 'verb' || item.pos === 'adj' ? 'dictionary form' : null;
      ex.speakAfter = item.ko;
    } else if (skill === 'cloze' && item.ex) {
      ex.type = 'text';
      ex.prompt = 'Fill the gap.';
      ex.sentence = item.ex.ko;
      ex.gapWord = pickGapWord(item);
      ex.answer = ex.gapWord;
      ex.koInput = true;
      ex.translation = item.ex.en;
      ex.speakAfter = item.ex.ko;
      if (!ex.gapWord) {
        // No clean surface form to blank out — fall back to plain production.
        ex.sentence = null;
        ex.prompt = 'Write this in Korean.';
        ex.target = item.en;
        ex.targetEn = true;
        ex.answer = item.ko;
        ex.speakAfter = item.ko;
      }
    } else {
      // Unknown skill for this item — degrade to production rather than throw.
      ex.type = 'text';
      ex.prompt = 'Write this in Korean.';
      ex.target = item.en;
      ex.targetEn = true;
      ex.answer = item.ko;
      ex.koInput = true;
      ex.speakAfter = item.ko;
    }
  }

  else if (item.kind === 'grammar') {
    const pickIdx = Math.floor(Math.random() * item.examples.length);
    const sample = item.examples[pickIdx];
    ex.type = 'build';
    ex.prompt = 'Build this sentence in Korean.';
    ex.target = sample.en;
    ex.targetEn = true;
    ex.answer = sample.ko;
    ex.tiles = buildTiles(sample.ko, item);
    ex.why = item.name + ' — ' + item.pattern;
    ex.speakAfter = sample.ko;
  }

  return ex;
}

/* Blank out the target word inside its own example sentence.
   Contextual production is the strongest exercise in the set. */
function pickGapWord(item) {
  const words = item.ex.ko.split(/\s+/);
  const stem = item.ko.replace(/다$/, '');
  let best = null;
  words.forEach(w => {
    const bare = w.replace(/[.,!?]/g, '');
    if (bare === item.ko) best = best || bare;
    if (!best && stem.length > 1 && bare.indexOf(stem) === 0) best = bare;
  });
  if (!best) {
    words.forEach(w => {
      const bare = w.replace(/[.,!?]/g, '');
      if (!best && stem.length > 1 && bare.indexOf(stem.slice(0, Math.max(1, stem.length - 1))) === 0) best = bare;
    });
  }
  return best;
}

function buildTiles(sentence, item) {
  const real = sentence.replace(/[.!?]$/, '').split(/\s+/);
  const distractors = [];
  const collect = ex => ex.ko.replace(/[.!?]$/, '').split(/\s+/).forEach(w => {
    if (!real.includes(w) && !distractors.includes(w)) distractors.push(w);
  });
  (item.examples || []).filter(e => e.ko !== sentence).forEach(collect);
  // Pull decoys from neighbouring grammar points too, so the tile set is
  // never just the answer in scrambled order.
  if (distractors.length < 3) {
    const unit = CORE_UNIT_BY_ID[item.unit];
    if (unit) unit.grammar.forEach(g => { if (g.id !== item.id) g.examples.forEach(collect); });
  }
  shuffle(distractors);
  const extras = distractors.slice(0, Math.min(3, Math.max(2, Math.round(real.length / 3))));
  const tiles = real.concat(extras).map((w, i) => ({ w, i }));
  shuffle(tiles);
  return tiles;
}

/* ---------------------------------------------------------------
   6. ANSWER CHECKING
   --------------------------------------------------------------- */
const stripPunct = s => (s || '').replace(/[.,!?~·"'’]/g, '').replace(/\s+/g, ' ').trim();
const normRom = s => stripPunct(String(s).toLowerCase()).replace(/[-\s]/g, '');
const normKo = s => stripPunct(String(s)).replace(/\s+/g, '');

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

function checkText(ex, input) {
  if (ex.romInput) {
    const a = normRom(input), b = normRom(ex.answer);
    if (a === b) return 'right';
    if (a && levenshtein(a, b) <= 1) return 'close';
    return 'wrong';
  }
  const a = normKo(input), b = normKo(ex.answer);
  if (a === b) return 'right';
  // accept the bare stem where a conjugated form was expected, and vice versa
  const alt = [ex.item.conj, ex.item.ko, ex.item.mod].filter(Boolean).map(normKo);
  if (alt.includes(a) && ex.skill === 'recall') return 'close';
  if (a && levenshtein(a, b) === 1 && b.length >= 3) return 'close';
  return 'wrong';
}

/* ---------------------------------------------------------------
   7. SPEECH
   ------------------------------------------------------------
   Every browser ships more than one Korean voice and they are not
   remotely equal. iOS installs a small "compact" Yuna by default and
   keeps the good one behind a download; Chrome has a flat local voice
   alongside Google's much better network one. Picking voices[0], which
   is what this used to do, lands on the worst of them about half the
   time — which is the entire reason speech here sounded robotic.

   So: rank them, take the best by default, and when the best available
   is still a poor one, say so and give the exact steps to fix it
   instead of leaving the learner to assume Korean sounds like that.
   --------------------------------------------------------------- */
let voices = [];

/* Markers that reliably separate the good voices from the bad ones,
   in English and in Korean since the names are localised. */
const V_BEST = /premium|프리미엄/i;
const V_GOOD = /enhanced|neural|natural|wavenet|향상된|고품질/i;

function voiceScore(v) {
  let s = 0;
  const n = v.name || '';
  if (V_BEST.test(n)) s += 100;
  else if (V_GOOD.test(n)) s += 80;
  if (/siri/i.test(n)) s += 55;
  if (/^google/i.test(n)) s += 45;
  // A non-local voice is synthesised server-side and is nearly always the
  // better-sounding one. It also needs a connection, hence the modest weight.
  if (v.localService === false) s += 25;
  if (/compact|espeak|저품질/i.test(n)) s -= 70;
  if (/^ko-KR$/i.test(v.lang)) s += 10;
  return s;
}

function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices()
    .filter(v => /^ko/i.test(v.lang))
    .sort((a, b) => voiceScore(b) - voiceScore(a));
}
if ('speechSynthesis' in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    refreshVoices();
    // A voice downloaded while the app is open should be picked up without
    // a reload, and Settings should stop showing the "it sounds robotic" note.
    if (view === 'settings') render();
  };
}

/* Deliberately not remembered as a name unless the learner picks one:
   leaving it on "best available" means the day they download the premium
   voice, Hanbit starts using it on its own. */
function chosenVoice() {
  if (!voices.length) return null;
  if (S.settings.ttsVoice) {
    const pick = voices.find(v => v.name === S.settings.ttsVoice);
    if (pick) return pick;
  }
  return voices[0];
}

function voiceTier(v) {
  if (!v) return 'none';
  const s = voiceScore(v);
  if (s >= 80) return 'premium';
  if (s >= 25) return 'good';
  return 'basic';
}

const VOICE_TIER_LABEL = { premium: 'high quality', good: 'decent', basic: 'basic — this is the robotic one', none: 'none' };
/* The dropdown already has the name in front of it, so it wants the bare
   grade rather than the sentence the status pill carries. */
const VOICE_TIER_SHORT = { premium: 'high quality', good: 'decent', basic: 'basic', none: '—' };

/* Per-platform, because the fix is completely different on each and a
   generic "install a better voice" helps nobody. */
function voiceFixSteps() {
  const ua = navigator.userAgent;
  const iOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (iOS) return {
    where: 'iPhone / iPad',
    steps: ['Open the iOS <b>Settings</b> app', 'Accessibility → Spoken Content → <b>Voices</b>', 'Korean → <b>유나 (Yuna)</b>', 'Tap the download arrow next to <b>Premium</b> (or Enhanced)', 'Come back here and pick it in the list above']
  };
  if (/Macintosh|Mac OS X/.test(ua)) return {
    where: 'Mac',
    steps: ['System Settings → Accessibility → <b>Spoken Content</b>', 'System Voice → <b>Manage Voices…</b>', 'Korean → <b>Yuna (Premium)</b> → download', 'Come back here and pick it in the list above']
  };
  if (/Android/.test(ua)) return {
    where: 'Android',
    steps: ['Settings → System → Languages &amp; input', '<b>Text-to-speech output</b>', 'Preferred engine → <b>Google Speech Services</b>', 'Install voice data → <b>Korean</b>', 'Reload this page']
  };
  return {
    where: 'Windows',
    steps: ['Settings → Time &amp; language → <b>Speech</b>', 'Manage voices → <b>Add voices</b> → Korean', 'Or use Chrome, which has a good Korean voice built in', 'Reload this page']
  };
}

function speak(text, btn) {
  if (!text || !('speechSynthesis' in window)) return;
  refreshVoices();
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (btn) {
      btn.classList.add('playing');
      const off = () => btn.classList.remove('playing');
      u.onend = off; u.onerror = off;
      setTimeout(off, 6000);
    }
    u.lang = 'ko-KR';
    u.rate = S.settings.ttsRate;
    const chosen = chosenVoice();
    if (chosen) u.voice = chosen;
    window.speechSynthesis.speak(u);
  } catch (e) { /* speech is a bonus, never a blocker */ }
}

/* Play the same line through one specific voice, so the voices can be
   compared by ear rather than by guessing from their names. */
function sampleVoice(name, btn) {
  if (!('speechSynthesis' in window)) return;
  const v = voices.find(x => x.name === name);
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('안녕하세요. 한국어 공부는 재미있어요.');
    u.lang = 'ko-KR';
    u.rate = S.settings.ttsRate;
    if (v) u.voice = v;
    if (btn) {
      btn.classList.add('playing');
      const off = () => btn.classList.remove('playing');
      u.onend = off; u.onerror = off;
      setTimeout(off, 8000);
    }
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------------------------------------------------------
   7b. YOUR VOICE
   ------------------------------------------------------------
   Two independent things happen when you hold the mic button, and
   either one can fail without taking the other down:

     · the microphone stream is recorded, and its loudness envelope
       is drawn, so you can see your own rhythm and play it back
     · the browser's speech recogniser is asked what it heard, which
       is the only honest way to tell you whether you said the word

   What this deliberately does NOT do is draw a "native speaker
   waveform" next to yours. Browsers will not let a page capture the
   audio that speech synthesis produces, so any such picture would be
   invented. Instead the reference track shows syllable beats — Korean
   is close to syllable-timed, so evenly spaced beats really are the
   target rhythm, and that comparison is real.

   Recognition is the one part of Hanbit that can touch a network:
   Chrome and Safari send the audio to their own speech service. It is
   off unless you ask for it, and Settings says so plainly.
   --------------------------------------------------------------- */

const SR_CTOR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

const Voice = {
  recording: false,
  media: null,          // MediaStream
  rec: null,            // MediaRecorder
  ctx: null,            // AudioContext for the envelope
  analyser: null,
  raf: 0,
  chunks: [],
  env: [],              // loudness envelope, one sample per animation frame
  startedAt: 0,
  lastUrl: null,
  sr: null,             // live SpeechRecognition
  onenv: null,          // called each frame so a canvas can redraw

  get canRecord() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  },
  get canListen() { return !!SR_CTOR; },

  /* Ask for the mic and start both capture paths. Resolves once audio is
     actually flowing so the UI never shows "recording" over a dead stream. */
  async start(opts) {
    opts = opts || {};
    if (this.recording) return;
    this.chunks = [];
    this.env = [];
    this.heard = null;
    this.srError = null;

    this.media = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
    });

    try {
      this.rec = new MediaRecorder(this.media);
      this.rec.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
      this.rec.start();
    } catch (e) { this.rec = null; }   // envelope still works without a recording

    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      const src = this.ctx.createMediaStreamSource(this.media);
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 1024;
      src.connect(this.analyser);
      const buf = new Uint8Array(this.analyser.fftSize);
      const tick = () => {
        if (!this.recording) return;
        this.analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        this.env.push(Math.sqrt(sum / buf.length));
        if (this.onenv) this.onenv(this.env);
        this.raf = requestAnimationFrame(tick);
      };
      this.recording = true;
      this.raf = requestAnimationFrame(tick);
    } catch (e) { this.recording = true; }

    if (opts.listen && this.canListen) this.startListening(opts.lang || 'ko-KR');
    this.startedAt = Date.now();
  },

  startListening(lang) {
    try {
      const sr = new SR_CTOR();
      sr.lang = lang;
      sr.interimResults = false;
      sr.maxAlternatives = 3;
      sr.continuous = false;
      sr.onresult = e => {
        const alts = [];
        for (let i = 0; i < e.results.length; i++) {
          const r = e.results[i];
          for (let j = 0; j < r.length; j++) alts.push(r[j].transcript);
        }
        this.heard = alts;
      };
      sr.onerror = e => { this.srError = e.error || 'failed'; };
      sr.start();
      this.sr = sr;
    } catch (e) { this.srError = 'failed'; }
  },

  /* Stop everything and hand back what was captured. Called from a finally
     block in the UI, so it must never throw whatever state it is in. */
  stop() {
    this.recording = false;
    cancelAnimationFrame(this.raf);
    const durationMs = Date.now() - this.startedAt;

    const blob = new Promise(resolve => {
      if (!this.rec || this.rec.state === 'inactive') return resolve(null);
      this.rec.onstop = () => resolve(this.chunks.length ? new Blob(this.chunks, { type: this.chunks[0].type }) : null);
      try { this.rec.stop(); } catch (e) { resolve(null); }
    });

    try { if (this.sr) this.sr.stop(); } catch (e) {}
    try { if (this.ctx) this.ctx.close(); } catch (e) {}
    try { if (this.media) this.media.getTracks().forEach(t => t.stop()); } catch (e) {}
    this.ctx = null; this.analyser = null; this.media = null;

    return blob.then(b => {
      if (this.lastUrl) URL.revokeObjectURL(this.lastUrl);
      this.lastUrl = b ? URL.createObjectURL(b) : null;
      return { url: this.lastUrl, env: this.env.slice(), durationMs };
    });
  },

  /* The recogniser fires onresult after stop() on most browsers, so give it
     a beat to arrive rather than reporting "heard nothing" prematurely. */
  waitForHeard(ms) {
    const started = Date.now();
    return new Promise(resolve => {
      const poll = () => {
        if (this.heard || this.srError || Date.now() - started > ms) return resolve(this.heard);
        setTimeout(poll, 90);
      };
      poll();
    });
  },

  play(url) {
    if (!url) return;
    const a = new Audio(url);
    a.play().catch(() => {});
    return a;
  },

  cancel() {
    try { if (this.sr) this.sr.abort(); } catch (e) {}
    try { if (this.rec && this.rec.state !== 'inactive') this.rec.stop(); } catch (e) {}
    try { if (this.ctx) this.ctx.close(); } catch (e) {}
    try { if (this.media) this.media.getTracks().forEach(t => t.stop()); } catch (e) {}
    cancelAnimationFrame(this.raf);
    this.recording = false; this.ctx = null; this.media = null; this.onenv = null;
  }
};

/* --- comparing what you said with what you meant to say --- */

const SYL_RE = /[가-힣]/g;
const syllableCount = s => (String(s).match(SYL_RE) || []).length;

/* Split a syllable block into its jamo so the comparison can see that
   밥 and 밤 differ by one sound rather than by one whole syllable. */
function decomposeSyllable(ch) {
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return [ch];
  const cho = Math.floor(code / 588);
  const jung = Math.floor((code % 588) / 28);
  const jong = code % 28;
  return jong ? [CHO[cho], JUNG[jung], JONG[jong]] : [CHO[cho], JUNG[jung]];
}

function toJamo(s) {
  const out = [];
  for (const ch of String(s)) {
    if (/[가-힣]/.test(ch)) out.push(...decomposeSyllable(ch));
    else if (/\S/.test(ch)) out.push(ch);
  }
  return out.join('');
}

const stripKo = s => String(s || '').replace(/[\s.,!?~…"'`·「」“”‘’()]/g, '');

/* How close was it? Jamo-level edit distance, so a near miss scores like a
   near miss instead of falling off a cliff. Returns 0..1. */
function pronunciationScore(target, heard) {
  const a = stripKo(target), b = stripKo(heard);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const ja = toJamo(a), jb = toJamo(b);
  const d = levenshtein(ja, jb);
  return Math.max(0, 1 - d / Math.max(ja.length, jb.length));
}

/* Pick whichever alternative the recogniser offered came closest — it
   routinely returns the right sounds under the wrong homophone. */
function bestHeard(target, alts) {
  if (!alts || !alts.length) return null;
  let best = alts[0], bestScore = -1;
  alts.forEach(t => {
    const s = pronunciationScore(target, t);
    if (s > bestScore) { bestScore = s; best = t; }
  });
  return { text: best, score: bestScore };
}

/* Syllable-by-syllable diff for the feedback line, so you can see WHICH
   part came out wrong rather than just being told the whole thing did. */
function diffSyllables(target, heard) {
  const a = [...stripKo(target)], b = [...stripKo(heard)];
  const n = a.length, m = b.length;
  const d = Array.from({ length: n + 1 }, (_, i) => [i, ...Array(m).fill(0)]);
  for (let j = 0; j <= m; j++) d[0][j] = j;
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
  }
  const out = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) {
      out.unshift({ ch: b[j - 1], ok: a[i - 1] === b[j - 1] }); i--; j--;
    } else if (j > 0 && d[i][j] === d[i][j - 1] + 1) {
      out.unshift({ ch: b[j - 1], ok: false }); j--;
    } else {
      out.unshift({ ch: a[i - 1], ok: false, missing: true }); i--;
    }
  }
  return out;
}

/* Count the loud moments in the envelope. Korean gives every syllable
   roughly the same length, so peaks against syllables is a fair proxy
   for "did you rush it or chop it up". */
function envelopePeaks(env) {
  if (!env || env.length < 6) return 0;
  const max = Math.max(...env);
  if (max < 0.02) return 0;
  const thr = max * 0.35;
  const smooth = env.map((v, i) => (env[i - 1] || v) * 0.25 + v * 0.5 + (env[i + 1] || v) * 0.25);
  let peaks = 0, above = false;
  for (let i = 0; i < smooth.length; i++) {
    if (!above && smooth[i] > thr) { peaks++; above = true; }
    else if (above && smooth[i] < thr * 0.6) above = false;
  }
  return peaks;
}

/* ---------------------------------------------------------------
   8. STATISTICS
   --------------------------------------------------------------- */
function stats() {
  const now = Date.now();
  const keys = Object.keys(S.cards).filter(k => ITEMS[k.split('|')[0]]);
  let learning = 0, young = 0, mature = 0, rsum = 0, rcount = 0;
  keys.forEach(k => {
    const c = S.cards[k];
    if (c.state === 'new') { learning++; return; }
    const s = c.S || 0;
    if (s >= 21) mature++; else if (s >= 3) young++; else learning++;
    rsum += currentR(c, now); rcount++;
  });

  const eligible = new Set(eligibleSequence());
  const introducedItems = Object.keys(S.introduced).filter(id => ITEMS[id] && eligible.has(id));
  const wordsKnown = introducedItems.filter(id => {
    const it = ITEMS[id];
    if (it.kind !== 'word' && it.kind !== 'hword') return false;
    const first = ladderFor(it)[0];
    const c = S.cards[ck(id, first)];
    return c && c.state !== 'new' && (c.S || 0) >= 3;
  }).length;

  // Honest measured retention: how often you got a real review right.
  let correct = 0, total = 0;
  Object.keys(S.days).forEach(k => { correct += S.days[k].correct; total += S.days[k].total; });
  const recent = S.log.filter(l => l.counted && l.t > now - 30 * DAY);
  let rcorrect = 0, rtotal = 0;
  recent.forEach(l => { const c = S.cards[l.key]; if (!c) return; rtotal++; if (l.grade > 1) rcorrect++; });

  // Forecast
  const forecast = [];
  for (let d = 0; d < 14; d++) {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const from = start.getTime() + d * DAY, to = from + DAY;
    let n = 0;
    keys.forEach(k => { const c = S.cards[k]; if (c.state !== 'new' && c.due >= (d === 0 ? 0 : from) && c.due < to) n++; });
    forecast.push(n);
  }

  // Streak, counting a generous two rest days per rolling week.
  let streak = 0, misses = 0;
  for (let d = 0; d < 400; d++) {
    const k = dayKeyBack(d);
    const rec = S.days[k];
    const studied = rec && rec.reviews > 0;
    if (studied) { streak++; misses = 0; }
    else if (d === 0) { /* today is not over yet */ }
    else { misses++; if (misses > 2) break; }
  }

  const timeToday = (S.days[todayKey()] || {}).ms || 0;
  let totalMs = 0; Object.keys(S.days).forEach(k => totalMs += S.days[k].ms || 0);

  return {
    learning, young, mature, cards: keys.length,
    predictedR: rcount ? rsum / rcount : 0,
    measuredR: rtotal ? rcorrect / rtotal : (total ? correct / total : 0),
    reviewsAll: total, wordsKnown,
    introduced: introducedItems.length,
    courseTotal: eligibleSequence().length,
    forecast, streak, timeToday, totalMs
  };
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtMin = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' m'; };

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function uniqBy(arr, f) { const seen = new Set(); return arr.filter(x => { const k = f(x); if (seen.has(k)) return false; seen.add(k); return true; }); }
function uniqFilter() { const seen = new Set(); return x => { if (seen.has(x)) return false; seen.add(x); return true; }; }

function progressBars() {
  const groups = [
    { label: 'Hangul — reading', ids: SEQUENCE.filter(id => ITEMS[id].stage === 'hangul') },
    { label: 'Units 1–4 — foundations', ids: SEQUENCE.filter(id => ['U1', 'U2', 'U3', 'U4'].includes(ITEMS[id].unit)) },
    { label: 'Units 5–8 — everyday life', ids: SEQUENCE.filter(id => ['U5', 'U6', 'U7', 'U8'].includes(ITEMS[id].unit)) },
    { label: 'Units 9–12 — real sentences', ids: SEQUENCE.filter(id => ['U9', 'U10', 'U11', 'U12'].includes(ITEMS[id].unit)) }
  ];
  return groups.map(g => {
    const seen = g.ids.filter(id => S.introduced[id]).length;
    const held = g.ids.filter(id => { const c = S.cards[ck(id, ladderFor(ITEMS[id])[0])]; return c && (c.S || 0) >= 3; }).length;
    const p1 = g.ids.length ? held / g.ids.length : 0;
    return `<div style="margin-bottom:13px">
      <div class="row" style="justify-content:space-between;margin-bottom:5px">
        <span style="font-size:13.5px">${g.label}</span>
        <span class="faint" style="font-size:12px">${held} / ${g.ids.length} holding${seen > held ? ` · ${seen - held} in progress` : ''}</span>
      </div>
      <div class="bar"><i class="${p1 > .8 ? 'good' : ''}" style="width:${Math.round(p1 * 100)}%"></i></div>
    </div>`;
  }).join('');
}

/* ---------- Session ---------- */
function renderSession() {
  const step = currentStep();
  if (!step) return shell(renderDone());

  const total = sess.queue.length;
  const done = sess.pos;
  const tier = comboTier(sess.combo);
  const head = `
  <div class="sess-head">
    <button class="iconbtn" data-act="quit" title="End session">✕</button>
    <div class="bar"><i style="width:${Math.round(done / Math.max(1, total) * 100)}%"></i></div>
    ${sess.drill ? `<span class="chip" style="flex:none">${esc(sess.drillTitle)}</span>` : ''}
    ${sess.combo >= 2 ? `<span class="combo-chip t${tier}">${tier >= 3 ? '🔥' : ''} ${sess.combo} streak</span>` : ''}
    <span class="count">${done} / ${total}</span>
  </div>`;

  if (sess.askStop) {
    return `<div id="app-inner" class="session-wrap">${head}
      <div class="card"><h2>You have hit ${S.settings.sessionMinutes} minutes</h2>
      <p class="sub">This is the point where extra reviews start paying less per minute, and where a second short session tomorrow beats pushing on today. ${sess.queue.length - sess.pos} cards are still queued — they will simply be waiting.</p>
      <div class="row"><button class="btn primary" data-act="stopnow">Stop here</button><button class="btn" data-act="keepgoing">Keep going</button></div>
      </div></div>`;
  }

  if (step.t === 'teach') return `<div class="session-wrap">${head}${renderTeach(ITEMS[step.id])}</div>`;
  if (step.t === 'reteach') return `<div class="session-wrap">${head}${renderReteach(step)}</div>`;
  return `<div class="session-wrap">${head}${renderExercise(step)}</div>`;
}

/* The re-teach card. Deliberately different from a first encounter:
   it names the problem, shows the history, and contrasts the item
   against whatever it is being confused with. */
function renderReteach(step) {
  const item = ITEMS[step.id];
  if (!item) return '<div class="card">Missing item.</div>';
  const other = step.contrast ? ITEMS[step.contrast] : null;
  const key = firstRungKey(step.id);
  const h = cardHistory(S.cards[key] || {});
  const ko = item.ko || item.ch || item.spelled || '';

  return `<div class="card teach">
    <div class="q-kind">Rebuilding · ${h.attempts ? `${h.correct} right out of ${h.attempts}` : 'a weak spot'}${h.lapses ? ` · missed ${h.lapses}×` : ''}</div>
    <div class="row" style="align-items:center;gap:16px">
      <div style="flex:1">
        <div class="big-ko">${esc(ko)}</div>
        <div class="rom">${esc(item.rom || item.sound || '')}${item.conj ? ' · ' + esc(item.conj) : ''}</div>
        <div class="en">${esc(item.en || item.gloss || '')}</div>
      </div>
      <button aria-label="Play audio" class="speak lg" data-speak="${esc(ko)}">${SPEAKER_SVG}</button>
    </div>
    ${other ? `<div class="contrast">
      <div class="ct-head">You have been mixing this up with:</div>
      <div class="row" style="gap:14px;align-items:center">
        <div><div class="ct-ko">${esc(other.ko || other.ch || '')}</div><div class="rom">${esc(other.rom || '')}</div></div>
        <div class="ct-en">${esc(other.en || '')}</div>
        <button aria-label="Play audio" class="speak" data-speak="${esc(other.ko || other.ch || '')}">${SPEAKER_SVG}</button>
      </div>
      <div class="ct-note">Say both out loud, back to back. Hearing the difference in your own voice separates them faster than reading them apart.</div>
    </div>` : ''}
    ${item.note ? `<div class="tip">${esc(item.note)}</div>` : ''}
    ${item.ex ? `<div class="ex"><div class="row"><div class="exko">${esc(item.ex.ko)}</div>
      <button aria-label="Play audio" class="speak" style="width:30px;height:30px" data-speak="${esc(item.ex.ko)}">${SPEAKER_SVG}</button></div>
      <div class="exen">${esc(item.ex.en)}</div></div>` : ''}
    <div style="margin-top:18px" class="row">
      <button class="btn primary" data-act="reteachdone">Ready — test me</button>

function teachFooter() {
  return `<div style="margin-top:18px" class="row">
    <button class="btn primary" data-act="learned">Got it — test me</button>
