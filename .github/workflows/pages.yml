name: Deploy Hanbit to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the check only, so a broken app is visible before it
  # is merged rather than after it has already gone live.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the app parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check.mjs

  build:
    name: Build the site
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the commit into the service worker cache name
        run: |
          sed -i "s/hanbit-v8/hanbit-v8-${GITHUB_SHA::7}/" sw.js

      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js offline.html _site/
          cp -r icons _site/icons
          cp -r audio _site/audio
          cp README.md _site/README.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
